<!doctype html>
<html lang="pt-BR">
<title>Flecha Secreta · Demonstração</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#21402f">
<meta name="description" content="Demonstração do Flecha Secreta: o amigo secreto da sua turma">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icone-32.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de uma coluna (até 760px), barra do grupo no topo e abas fixas embaixo, como um app de celular. */
:root{
  --mata:#21402f;      /* verde-mata da chácara */
  --mata-2:#2f5a42;
  --brasa:#b5342b;     /* vermelho de Natal */
  --palha:#c9973a;     /* dourado da flecha */
  --fundo:#eef1ea;     /* papel verde-claro */
  --cartao:#fbfcf8;
  --tinta:#1d2620;
  --tinta-2:#55615a;
  --linha:#d5ddd3;
  --suave:#e3e9e0;
  --ok:#2c7a4b; --aviso:#a86a12; --erro:#b5342b;
  --sobre-mata:#f3ead2;
  --f-titulo:"Young Serif", Georgia, "Times New Roman", serif;
  --f-texto:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --raio:14px;
  /* margens de segurança do iPhone (relógio, barra inferior). Dentro da página de entrada valem zero,
     porque a própria página de entrada já reserva esse espaço. */
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
html.embutido{--sat:0px;--sab:0px;--sal:0px;--sar:0px}
/* no iPhone, o sistema desfoca uma faixa logo abaixo do relógio: o cabeçalho ganha um respiro para o título ficar nítido */
html.embutido .topo .wrap{padding-top:40px}
/* tela de entrada no iPhone: cabe inteira na tela, sem rolar */
html.embutido,html.embutido body{height:100%}
html.embutido .capa{min-height:100vh;min-height:100dvh;height:auto;padding-top:56px;padding-bottom:16px;align-content:center}
/* telas de entrada: o fundo da página inteira fica verde, sem sobras claras */
html.tela-capa,html.tela-capa body{background:var(--mata)}
html.embutido .capa.compacta .cartao{margin-top:14px}
html.embutido body,html.embutido{min-height:100%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --mata:#16291e;--mata-2:#24402f;--brasa:#e0655a;--palha:#e2b65e;--fundo:#0f1712;--cartao:#17221b;--tinta:#e8eee9;--tinta-2:#a3b2a8;--linha:#2a3a30;--suave:#1e2c23;--ok:#5cc08a;--aviso:#e0a64a;--erro:#ef7b70;--sobre-mata:#f3ead2;color-scheme:dark}}
:root[data-theme="dark"]{--mata:#16291e;--mata-2:#24402f;--brasa:#e0655a;--palha:#e2b65e;--fundo:#0f1712;--cartao:#17221b;--tinta:#e8eee9;--tinta-2:#a3b2a8;--linha:#2a3a30;--suave:#1e2c23;--ok:#5cc08a;--aviso:#e0a64a;--erro:#ef7b70;--sobre-mata:#f3ead2;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--fundo);color:var(--tinta);font:15px/1.5 var(--f-texto);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:30;background:var(--mata)}
h1,h2,h3{font-family:var(--f-titulo);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--brasa)}
:focus-visible{outline:2px solid var(--palha);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.85em;letter-spacing:.02em}
.rotulo{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-2);font-weight:600}
.muted{color:var(--tinta-2)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar))}
/* tablets e computadores: um pouco mais de área útil, mantendo uma coluna central */
@media (min-width:900px){ .wrap{max-width:880px} .grade-part{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))} .modal{max-width:580px} }
/* celular deitado: cabeçalho e abas mais baixos para sobrar espaço */
@media (max-height:480px) and (orientation:landscape){ .topo .wrap{padding-block:4px} .topo .logo{width:36px;height:36px} .abas button{padding:3px 2px;grid-auto-flow:column;gap:6px;align-items:center} main{padding-bottom:calc(56px + var(--sab))} }
/* celulares bem estreitos */
@media (max-width:360px){ .btn{padding:10px 14px} .faixa-info .val{font-size:17px} .topo .tit h1{font-size:17px} .abas.muitas button{font-size:9.5px;letter-spacing:-.02em} .abas.muitas .wrap{padding-left:2px;padding-right:2px} }
.abas button span{max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* ---------- botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--brasa);color:#fff;text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 1.5px var(--linha)}
.btn.mata{background:var(--mata-2);color:var(--sobre-mata)}
.btn.peq{padding:6px 12px;min-height:34px;font-size:13px}
.btn.larga{width:100%}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;color:var(--brasa);cursor:pointer;padding:4px 0;font-weight:600}
label.campo{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--tinta-2)}
.inp{width:100%;border:1.5px solid var(--linha);background:var(--cartao);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--tinta)}
.inp:focus{border-color:var(--palha);outline:none}
textarea.inp{min-height:90px;resize:vertical}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grade2{grid-template-columns:1fr}}
.pilha{display:grid;gap:14px}
.linha-acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- cartões ---------- */
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);padding:18px}
.secao{display:grid;gap:12px;margin-top:22px}
.secao>h2{font-size:21px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--suave);color:var(--tinta-2);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.aviso{background:color-mix(in srgb,var(--aviso) 16%,transparent);color:var(--aviso)}
.chip.erro{background:color-mix(in srgb,var(--erro) 14%,transparent);color:var(--erro)}
.chip.ouro{background:color-mix(in srgb,var(--palha) 22%,transparent);color:color-mix(in srgb,var(--palha) 60%,var(--tinta))}

/* ---------- cabeçalho do grupo ---------- */
.topo{background:var(--mata);color:var(--sobre-mata);position:sticky;top:var(--sat);z-index:20}
.topo .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.topo .logo{width:44px;height:44px;border-radius:12px;flex:none;object-fit:cover;background:var(--mata-2);display:grid;place-items:center;overflow:hidden}
.topo .logo img{width:100%;height:100%;object-fit:cover}
.topo .tit{min-width:0;flex:1}
.topo .tit h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .linha2{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;opacity:.92;margin-top:2px}
.auditor-tag{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--palha) 30%,transparent);color:#fff3d6;border:1px solid color-mix(in srgb,var(--palha) 60%,transparent);border-radius:999px;padding:1px 9px 1px 3px;font-weight:600}
.auditor-tag .av{width:18px;height:18px}
.topo .icobtn{background:none;border:0;color:var(--sobre-mata);padding:8px;border-radius:10px;cursor:pointer}
.topo .icobtn:hover{background:var(--mata-2)}
.topo .icobtn svg{width:22px;height:22px;display:block}
.topo .sair-topo{display:grid;justify-items:center;gap:1px;flex:none;padding:6px 6px 4px}
.topo .sair-topo span{font-size:10.5px;font-weight:600;opacity:.85;line-height:1}

.faixa-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;margin-top:16px}
.faixa-info>div{background:var(--cartao);padding:12px 14px;min-width:0}
.faixa-info .val{font-family:var(--f-texto);font-weight:700;font-size:19px;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.faixa-info .val .hora{font-weight:600;color:var(--brasa)}
.faixa-info .sub{font-size:12.5px;color:var(--tinta-2);overflow-wrap:anywhere}
@media (max-width:560px){.faixa-info{grid-template-columns:1fr 1fr}.faixa-info>div:last-child{grid-column:1/-1}}

/* ---------- abas inferiores ---------- */
main{padding-bottom:calc(90px + var(--sab))}
.abas{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--cartao);border-top:1px solid var(--linha);padding-bottom:var(--sab)}
.abas .wrap{display:flex;justify-content:space-around;padding-block:4px}
.abas button{flex:1;background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--tinta-2);cursor:pointer;position:relative;min-width:0}
.abas button svg{width:22px;height:22px}
.abas button[aria-current="true"]{color:var(--brasa)}
.sub-abas{position:sticky;top:64px;z-index:15;background:var(--fundo);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 10px;margin:0 -16px;border-bottom:1px solid var(--linha)}
.sub-abas::-webkit-scrollbar{display:none}
.sub-abas.mais{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.sub-abas button{flex:none;border:1.5px solid var(--linha);background:var(--cartao);color:var(--tinta-2);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.sub-abas button[aria-current="true"]{background:var(--mata-2);border-color:var(--mata-2);color:var(--sobre-mata)}
.sub-abas .cont{font-size:11.5px;background:color-mix(in srgb,currentColor 14%,transparent);border-radius:999px;padding:0 7px;line-height:18px}
.sub-abas .cont.alerta{background:var(--brasa);color:#fff}
.filtro-part{display:grid;gap:8px}
.part-adm{align-items:center;padding:10px 12px}
.part-adm .seta{font-size:24px;color:var(--tinta-2);align-self:center;line-height:1}
.abas.muitas button{font-size:10.5px;white-space:nowrap}
.abas.muitas .wrap{padding-left:max(4px,var(--sal));padding-right:max(4px,var(--sar))}
@media (max-width:380px){.abas.muitas button{font-size:10px}}
.abas.muitas button svg{width:21px;height:21px}
.abas .bolinha{position:absolute;top:4px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--brasa);border:2px solid var(--cartao)}

/* ---------- avatar ---------- */
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:var(--suave);display:inline-grid;place-items:center;font-family:var(--f-titulo);color:var(--mata-2);font-size:15px;overflow:hidden}
.av.g{width:84px;height:84px;font-size:30px}
.av.anon{background:var(--mata-2);color:var(--sobre-mata)}
.av svg{width:55%;height:55%}

/* ---------- meu amigo ---------- */
.bilhete{position:relative;border-radius:18px;background:var(--mata);color:var(--sobre-mata);padding:26px 22px;overflow:hidden;margin-top:18px}
.bilhete::after{content:"";position:absolute;inset:10px;border:1.5px dashed color-mix(in srgb,var(--palha) 55%,transparent);border-radius:12px;pointer-events:none}
.bilhete .rotulo{color:color-mix(in srgb,var(--sobre-mata) 70%,transparent)}
.bilhete .nome-amigo{font-family:var(--f-titulo);font-size:clamp(30px,8vw,44px);color:#fff;margin:8px 0 2px;line-height:1.05}
.bilhete .coberto{display:grid;justify-items:center;text-align:center;gap:10px;padding:18px 0}
.bilhete .coberto svg{width:72px;height:72px}
.bilhete .desejos{background:color-mix(in srgb,#000 18%,transparent);border-radius:10px;padding:12px 14px;margin-top:14px;white-space:pre-wrap;font-size:14.5px}
.revelado{display:flex;gap:16px;align-items:center}
.revelado .av.g{border:3px solid var(--palha)}

/* ---------- conversas ---------- */
.lista{display:grid;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:13px 14px;border:0;background:none;text-align:left;width:100%;cursor:pointer;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.item:hover{background:var(--suave)}
.item .txt{min-width:0;flex:1}
.item .t1{font-weight:700;display:flex;gap:8px;align-items:center}
.item .t2{font-size:13px;color:var(--tinta-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .hora{font-size:11.5px;color:var(--tinta-2);align-self:flex-start}
.ponto{width:9px;height:9px;border-radius:50%;background:var(--brasa);flex:none}
.chat{display:flex;flex-direction:column;gap:8px;padding:14px 0}
.bolha{max-width:82%;padding:9px 13px;border-radius:16px;background:var(--cartao);border:1px solid var(--linha);white-space:pre-wrap;overflow-wrap:anywhere}
.bolha.minha{align-self:flex-end;background:var(--mata-2);color:var(--sobre-mata);border-color:transparent;border-bottom-right-radius:5px}
.bolha:not(.minha){border-bottom-left-radius:5px}
.bolha .meta{font-size:11px;opacity:.7;margin-top:3px}
.compor{position:sticky;bottom:calc(64px + var(--sab));background:var(--fundo);padding:10px 0;display:flex;gap:8px;align-items:flex-end}
.senha-wrap{position:relative;display:block}
.senha-wrap .inp{padding-right:48px}
.senha-wrap .olho{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--tinta-2);display:grid;place-items:center;cursor:pointer;border-radius:10px}
.senha-wrap .olho svg{width:22px;height:22px}
.compor textarea{min-height:46px;max-height:45vh;flex:1;resize:none;line-height:1.4}
.bolha{cursor:pointer;-webkit-tap-highlight-color:transparent}
.bolha .citacao{margin:0 0 6px;font-size:12.5px}
.bolha.minha .citacao{background:color-mix(in srgb,#000 22%,transparent);color:color-mix(in srgb,var(--sobre-mata) 85%,transparent);border-left-color:var(--palha)}
.bolha.minha .citacao b{color:var(--sobre-mata)}
.bolha.marcada{outline:2px solid var(--palha);outline-offset:2px}
.compor-wrap{position:sticky;bottom:calc(64px + var(--sab));background:var(--fundo);padding-top:6px}
.compor-wrap .compor{position:static;padding-top:4px}
.compor-wrap .citacao{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-top:0}
.dica-chat{font-size:12.5px;color:var(--tinta-2);text-align:center;margin-top:6px}
.acoes-msg{display:grid;gap:8px}
.acoes-msg .previa{background:var(--suave);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:30vh;overflow:auto}
/* foto ampliada */
.av-zoom{border:0;padding:0;background:none;cursor:zoom-in;border-radius:50%;flex:none}
.foto-grande{display:grid;justify-items:center;gap:12px}
.foto-grande img{width:100%;max-width:340px;aspect-ratio:1;object-fit:cover;border-radius:18px;border:3px solid var(--palha);background:var(--suave)}
/* boas-vindas e ajuda */
.boas-vindas{gap:12px}
.boas-vindas .selo{font-size:42px;line-height:1;text-align:center}
.boas-vindas h2{text-align:center}
.boas-vindas ul{margin:0;padding-left:20px;display:grid;gap:6px}
.boas-vindas .papel{border-radius:14px;padding:14px 16px;display:grid;gap:8px;background:color-mix(in srgb,var(--palha) 12%,var(--cartao));border:1.5px solid color-mix(in srgb,var(--palha) 55%,transparent)}
.boas-vindas .papel h3{font-size:18px}
.ajuda details{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:0 14px}
.ajuda details+details{margin-top:8px}
.ajuda summary{cursor:pointer;font-weight:700;padding:13px 0;list-style:none;display:flex;gap:10px;align-items:center}
.ajuda summary::-webkit-details-marker{display:none}
.ajuda summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--tinta-2);font-weight:400}
.ajuda details[open] summary::after{content:"–"}
.ajuda summary svg{width:20px;height:20px;flex:none;color:var(--mata-2)}
.ajuda .corpo{padding:0 0 14px;display:grid;gap:8px;font-size:14.5px}
.ajuda .corpo ul,.ajuda .corpo ol{margin:0;padding-left:20px;display:grid;gap:5px}
.ajuda .papel-ajuda{border-color:color-mix(in srgb,var(--palha) 60%,transparent);background:color-mix(in srgb,var(--palha) 8%,var(--cartao))}
.cab-conversa{display:flex;gap:12px;align-items:center;padding-top:16px}

/* ---------- mural ---------- */
.post{display:flex;gap:12px}
.post .corpo{min-width:0;flex:1}
.post .texto{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.post.admin{border:1.5px solid color-mix(in srgb,var(--palha) 70%,transparent);background:color-mix(in srgb,var(--palha) 10%,var(--cartao))}
.post.admin .texto{font-size:16px}
.citacao{border-left:3px solid var(--palha);background:var(--suave);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--tinta-2);margin-top:6px;overflow-wrap:anywhere}
.citacao b{color:var(--tinta)}
.alternar{display:inline-flex;background:var(--suave);border-radius:999px;padding:3px}
.alternar button{border:0;background:none;padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;color:var(--tinta-2)}
.alternar button[aria-pressed="true"]{background:var(--cartao);color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* ---------- participantes ---------- */
.grade-part{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.part{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);padding:14px 12px;display:grid;justify-items:center;text-align:center;gap:6px;cursor:pointer}
.part .nome{font-weight:700;line-height:1.2}
.part .badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:22px}
.part .tem-desejo{font-size:12px;color:var(--tinta-2);display:inline-flex;gap:4px;align-items:center}
.part.com-desejo{border:1.5px solid color-mix(in srgb,var(--palha) 75%,transparent);background:color-mix(in srgb,var(--palha) 9%,var(--cartao))}
.part.com-desejo .tem-desejo{color:color-mix(in srgb,var(--palha) 55%,var(--tinta));font-weight:700}
.part.com-desejo .tem-desejo svg{width:15px;height:15px}
.part.sem-desejo{border-style:dashed}
.part.sem-desejo .av{opacity:.75}

/* ---------- admin ---------- */
.tabela-wrap{overflow-x:auto;border:1px solid var(--linha);border-radius:var(--raio);background:var(--cartao)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--linha);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2);font-weight:700;background:var(--suave)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;color:var(--tinta-2)}
.estado{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.estado>div{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:12px}
.estado .n{font-family:var(--f-titulo);font-size:26px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.estado{grid-template-columns:1fr 1fr}}
.cadeado{display:flex;gap:14px;align-items:center}
.cadeado svg{width:40px;height:40px;flex:none;color:var(--palha)}
.logo-prev{width:88px;height:88px;border-radius:16px;background:var(--suave);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-prev img{width:100%;height:100%;object-fit:cover}

/* ---------- folha A4 do auditor ---------- */
.folha{background:#fff;color:#111;width:100%;max-width:210mm;margin:0 auto;padding:12mm 12mm;border:1px solid var(--linha);font-family:var(--f-texto);aspect-ratio:auto}
.folha-wrap{overflow-x:auto}
.folha .cab{display:flex;gap:14px;align-items:center;border-bottom:2px solid #21402f;padding-bottom:8px}
.folha .cab .lg{width:52px;height:52px;border-radius:8px;overflow:hidden;flex:none;display:grid;place-items:center;background:#eef1ea}
.folha .cab .lg img{width:100%;height:100%;object-fit:cover}
.folha h3{font-size:20px;color:#21402f}
.folha .meta{font-size:11.5px;color:#444;margin-top:2px}
.folha table{font-size:12px;margin-top:8px}
.folha th{background:#eef1ea;color:#333;padding:5px 8px;font-size:10px}
.folha td{padding:0 8px;height:7.2mm;border-bottom:1px solid #bbb;color:#111}
.folha td.n{width:12mm;text-align:center;font-variant-numeric:tabular-nums;color:#555}
.folha .rodape{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:10px;font-size:11.5px}
.folha .caixa{display:inline-block;width:11px;height:11px;border:1.4px solid #333;vertical-align:-1px;margin:0 4px 0 10px}
.folha .assin{border-top:1px solid #333;padding-top:3px;margin-top:22px;text-align:center}
.folha .dica{font-size:10.5px;color:#555;margin-top:8px;border:1px dashed #aaa;padding:6px 8px;border-radius:6px}

/* ---------- login ---------- */
.capa{min-height:100vh;display:grid;align-content:center;padding-block:40px;background:var(--mata);color:var(--sobre-mata)}
.capa .marca{display:flex;gap:14px;align-items:center}
.capa .marca svg{width:64px;height:64px;flex:none}
.capa h1{font-size:clamp(36px,10vw,52px);color:#fff}
.capa .lema{opacity:.85;margin-top:4px}
.capa .cartao{color:var(--tinta);margin-top:28px}
.capa.compacta .marca svg{width:46px;height:46px}
.capa.compacta h1{font-size:clamp(28px,8.4vw,38px);white-space:nowrap}
.capa.compacta .lema{font-size:14px;margin-top:2px}
.capa.compacta .cartao{padding:16px 16px 14px;margin-top:16px}
.capa.compacta .cartao.pilha{gap:10px}
.capa.compacta .cartao h2{font-size:20px !important}
.capa.compacta .inp{padding:9px 11px}
.capa.compacta .rodape-login{font-size:12px}
.capa.compacta .pedir-desc{display:none}
@media (max-height:700px){.capa.compacta .pedir-titulo{font-size:14.5px !important}}

/* ---------- modais e avisos ---------- */
.modal-fundo{position:fixed;inset:0;background:rgba(10,20,14,.55);z-index:50;display:grid;place-items:end center;padding:16px;padding-bottom:max(16px,var(--sab))}
@media (min-width:640px){.modal-fundo{place-items:center}}
.modal{background:var(--cartao);border-radius:18px;padding:20px;width:100%;max-width:520px;max-height:86vh;overflow:auto;display:grid;gap:14px}
.modal h2{font-size:21px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sab));z-index:60;background:var(--tinta);color:var(--fundo);padding:11px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.erro{background:var(--erro);color:#fff}
.faixa{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.faixa.aviso-f{background:color-mix(in srgb,var(--aviso) 14%,var(--cartao));border:1px solid color-mix(in srgb,var(--aviso) 35%,transparent)}
.faixa.trapaca{background:color-mix(in srgb,var(--brasa) 12%,var(--cartao));border:1px solid color-mix(in srgb,var(--brasa) 35%,transparent)}
.faixa.info{background:var(--suave)}
.carregando{display:grid;place-items:center;padding:60px 0;color:var(--tinta-2)}
.giro{width:28px;height:28px;border:3px solid var(--linha);border-top-color:var(--brasa);border-radius:50%;animation:g 0.8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation:none}}

.sair-demo{position:fixed;left:max(10px,var(--sal));bottom:calc(74px + var(--sab));z-index:40;background:var(--mata-2);color:var(--sobre-mata);border:2px solid var(--palha);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:pointer}

.email-prev{border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:#f3efe6;color:#222}

  @page{size:A4;margin:12mm}

  function log(email, acao, det) { try { T('Log').insert({ em: agora(), email: email || '', acao: acao, detalhe: det || '' }); } catch (e) { } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lista(s) { return String(s || '').split(',').map(norm).filter(function (x) { return x; }); }
  function somaDia(iso, d) { var p = iso.split('-'); var dt = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + d)); return dt.toISOString().substr(0, 10); }
  function dataBR(iso) { if (!iso) return 'a definir'; var p = String(iso).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

  /* ---------- acesso a dados ---------- */
  function usuario(email) { email = norm(email); return T('Usuarios').all().filter(function (u) { return u.email === email; })[0] || null; }
  function grupo(id) { return T('Grupos').all().filter(function (g) { return g.id === id; })[0] || null; }
  function membros(gid) { return T('Membros').all().filter(function (m) { return m.grupoId === gid; }); }
  function membro(gid, email) { email = norm(email); return membros(gid).filter(function (m) { return m.email === email; })[0] || null; }
  function ehAdmin(g, email) { return lista(g.admins).indexOf(norm(email)) >= 0; }
  function ehSuper(email) { return P.superadmins().map(norm).indexOf(norm(email)) >= 0; }
  function nomeDe(email) { var u = usuario(email); return u ? u.nome : email; }

  /* ---------- sessão ---------- */
  function sessao(token) {
    if (!token) erro('Sua sessão expirou. Entre novamente.');
    var h = Cripto.hashToken(token), agoraMs = Date.now();
    var s = T('Sessoes').all().filter(function (x) { return x.tokenHash === h; })[0];
    if (!s || new Date(s.expira).getTime() < agoraMs) erro('Sua sessão expirou. Entre novamente.');
    var u = usuario(s.email);
    if (!u || String(u.ativo) !== 'sim') erro('Conta não encontrada.');
    return u;
  }
  function criarSessao(email) {
    var t = Cripto.token();
    var tabela = T('Sessoes'), lim = Date.now();
    tabela.remove(function (x) { return new Date(x.expira).getTime() < lim; });
    tabela.insert({ tokenHash: Cripto.hashToken(t), email: email, expira: new Date(Date.now() + 30 * 864e5).toISOString() });
    T('Usuarios').update(function (u) { return u.email === email; }, { ultimoAcesso: agora() });
    return t;
  }
  function exigirMembro(u, gid) {
    var g = grupo(gid); if (!g) erro('Grupo não encontrado.');
    var m = membro(gid, u.email);
    if (!m && !ehSuper(u.email)) erro('Você não participa deste grupo.');
    return { g: g, m: m };
  }
  function exigirAdmin(u, gid) {
    var x = exigirMembro(u, gid);
    if (!ehAdmin(x.g, u.email) && !ehSuper(u.email)) erro('Apenas administradores podem fazer isso.');
    return x;
  }

  /* ---------- e-mails ---------- */
  function moldura(titulo, corpo, g) {
    var cab = g ? esc(g.nome) : APP_NOME;
    return '<div style="background:#f3efe6;padding:24px 12px;font-family:Georgia,serif">' +
      '<div style="max-width:520px;margin:auto;background:#fffdf8;border:1px solid #e3dccb;border-radius:14px;overflow:hidden">' +
      '<div style="background:#1f3d2b;color:#f6e7c1;padding:18px 22px"><div style="font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.8">' + APP_NOME + '</div>' +
      '<div style="font-size:20px;margin-top:4px">' + cab + '</div></div>' +
      '<div style="padding:22px;color:#2b2a26;font-family:Arial,sans-serif;font-size:15px;line-height:1.55">' +
      '<h2 style="font-family:Georgia,serif;color:#1f3d2b;margin:0 0 12px">' + titulo + '</h2>' + corpo + '</div>' +
      '<div style="padding:12px 22px;color:#8a8370;font-size:12px;font-family:Arial,sans-serif;border-top:1px solid #eee5d3">' + APP_NOME + ' · ' + APP_LEMA + '</div></div></div>';
  }
  function botao(url, txt) { return '<p style="margin:22px 0"><a href="' + url + '" style="background:#b3302a;color:#fff;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:bold">' + txt + '</a></p><p style="font-size:12px;color:#8a8370">Se o botão não abrir, copie este endereço: ' + url + '</p>'; }
  function link(acao, t) { return P.urlApp() + (P.urlApp().indexOf('?') >= 0 ? '&' : '?') + 'acao=' + acao + '&t=' + t; }

  /* Notificação no celular (app ntfy). Nunca leva o nome sorteado nem quem foi escolhido. */
  /* Avisa várias pessoas de uma vez (sorteio, mural, lembretes). Só quem ativou o Telegram recebe. */
  /* Notificação do próprio aplicativo (OneSignal), para quem ativou no Perfil */
  function pushAtivo() { return !!(P.pushAtivo && P.pushAtivo()); }
  function enviarPush(emails, titulo, msg) {
    if (!emails.length || !pushAtivo()) return;
    try { P.push(emails.map(Cripto.idPush), titulo, msg, P.urlApp()); } catch (e) { }
  }
  function avisarVarios(emails, titulo, msg) {
    var chats = [], push = [], pessoas = {};
    T('Usuarios').all().forEach(function (u) {
      if (emails.indexOf(u.email) < 0) return;
      if (/^tg:/.test(u.avisoTopico)) { chats.push(u.avisoTopico.substr(3)); pessoas[u.email] = 1; }
      if (u.push) { push.push(u.email); pessoas[u.email] = 1; }
    });
    enviarPush(push, titulo, msg);
    if (chats.length && P.avisar) {
      try { if (P.avisarVarios) P.avisarVarios(chats, titulo, msg, P.urlApp()); else chats.forEach(function (c) { P.avisar(c, titulo, msg, P.urlApp()); }); } catch (e) { }
    }
    return Object.keys(pessoas).length;
  }
  /* Evita excesso de avisos: devolve true só se não houve aviso igual nos últimos 'segundos' */
  function primeiraVez(chave, segundos) { return P.umaVez ? P.umaVez(chave, segundos) : true; }
  function resumo(t, n) { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.substr(0, n - 1) + '…' : t; }

  function avisar(email, titulo, msg) {
    try {
      var u = usuario(email); if (!u) return;
      if (u.push) enviarPush([u.email], titulo, msg);
      if (/^tg:/.test(u.avisoTopico) && P.avisar) P.avisar(u.avisoTopico.substr(3), titulo, msg, P.urlApp());
    } catch (e) { }
  }
  function formatarTelefone(t) {
    var d = String(t || '').replace(/\D/g, '');
    if (d.length === 0) return '';
    if (d.length === 13 && d.substr(0, 2) === '55') d = d.substr(2);
    if (d.length === 11) return '(' + d.substr(0, 2) + ') ' + d.substr(2, 5) + '-' + d.substr(7);
    if (d.length === 10) return '(' + d.substr(0, 2) + ') ' + d.substr(2, 4) + '-' + d.substr(6);
    erro('Telefone inválido. Use o formato (99) 99999-9999.');
  }
  function telefoneLiberadoPara(email) {
    var gids = T('Membros').all().filter(function (m) { return m.email === email; }).map(function (m) { return m.grupoId; });
    return T('Grupos').all().some(function (g) { return gids.indexOf(g.id) >= 0 && g.telefoneLiberado === 'sim'; });
  }

  function enviarConvite(g, m, quemIncluiu) {
    if (ficticio(m.email)) return { ok: false, erro: 'E-mail fictício (substitua antes de enviar).' };
    var u = usuario(m.email), tk = Cripto.token();
    T('Membros').update(function (x) { return x.grupoId === g.id && x.email === m.email; }, { tokenConvite: tk, conviteEnviadoEm: agora() });
    var precisaSenha = !u || !u.senhaHash;
    var corpo = '<p>Olá, <b>' + esc(u ? u.nome : m.email) + '</b>!</p><p>' + esc(nomeDe(quemIncluiu)) + ' incluiu você no amigo secreto <b>' + esc(g.nome) + '</b>.</p>' +
      '<p>Revelação: <b>' + dataBR(g.dataRevelacao) + (g.horaRevelacao ? ' às ' + esc(g.horaRevelacao) : '') + '</b>' + (g.localNome ? ' — ' + esc(g.localNome) : '') + '.</p>' +
      '<p>Clique abaixo para confirmar sua participação' + (precisaSenha ? ' e criar sua senha de acesso' : '') + '. Isso também confirma que seu e-mail está funcionando.</p>' +
      botao(link('convite', tk), precisaSenha ? 'Confirmar e criar senha' : 'Confirmar participação') +
      (precisaSenha ? '' : '<p style="font-size:13px;color:#8a8370">Você continua usando o mesmo e-mail e a mesma senha. Se não quiser participar desta vez, basta ignorar este e-mail. Se mudou de e-mail, avise o administrador.</p>');
    var r = P.enviarEmail({ para: m.email, assunto: 'Convite: amigo secreto ' + g.nome, html: moldura('Você foi convidado!', corpo, g) });
    log(quemIncluiu, 'convite', m.email + (r.ok ? ' ok' : ' falhou: ' + r.erro));
    return r;
  }

  /* =================== API pública =================== */
  var api = {};

  api.info = function () { return { app: APP_NOME, lema: APP_LEMA, hoje: hoje() }; };

  api.entrar = function (a) {
    var email = norm(a.email), u = usuario(email);
    if (!u || !u.senhaHash || String(u.ativo) !== 'sim') erro('E-mail ou senha incorretos. Se ainda não criou sua senha, use o link do e-mail de convite.');
    if (Cripto.hashSenha(String(a.senha || ''), u.salt) !== u.senhaHash) { log(email, 'login-falhou'); erro('E-mail ou senha incorretos.'); }
    log(email, 'login');
    return { token: criarSessao(email) };
  };

  api.sair = function (a) { var h = Cripto.hashToken(a.token || ''); T('Sessoes').remove(function (x) { return x.tokenHash === h; }); return true; };

  api.esqueciSenha = function (a) {
    var u = usuario(a.email);
    if (u && String(u.ativo) === 'sim') {
      var tk = Cripto.token();
      T('Usuarios').update(function (x) { return x.email === u.email; }, { tokenSenha: tk, tokenSenhaExpira: new Date(Date.now() + 2 * 864e5).toISOString() });
      P.enviarEmail({ para: u.email, assunto: APP_NOME + ': nova senha', html: moldura('Criar nova senha', '<p>Recebemos um pedido para criar uma nova senha. Se não foi você, ignore este e-mail.</p>' + botao(link('senha', tk), 'Criar nova senha')) });
    }
    return 'Se o e-mail estiver cadastrado, você receberá um link para criar nova senha.';
  };

  /* Abre link de convite / nova senha */
  api.lerLink = function (a) {
    var t = String(a.t || '');
    if (!t) erro('Link inválido.');
    if (a.acao === 'convite') {
      var m = T('Membros').all().filter(function (x) { return x.tokenConvite === t; })[0];
      if (!m) erro('Este convite já foi usado ou não é mais válido. Se já criou sua senha, basta entrar.');
      var u = usuario(m.email), g = grupo(m.grupoId);
      return { tipo: 'convite', email: m.email, nome: u ? u.nome : '', grupo: g ? g.nome : '', precisaSenha: !u || !u.senhaHash };
    }
    if (a.acao === 'senha') {
      var u2 = T('Usuarios').all().filter(function (x) { return x.tokenSenha === t; })[0];
      if (!u2 || new Date(u2.tokenSenhaExpira).getTime() < Date.now()) erro('Este link expirou. Peça uma nova senha.');
      return { tipo: 'senha', email: u2.email, nome: u2.nome, precisaSenha: true };
    }
    if (a.acao === 'email') {
      var u3 = T('Usuarios').all().filter(function (x) { return x.tokenEmail === t; })[0];
      if (!u3 || new Date(u3.tokenEmailExpira).getTime() < Date.now()) erro('Este link de troca de e-mail expirou ou já foi usado. Peça a troca de novo no Perfil.');
      if (usuario(u3.emailNovo)) erro('Esse e-mail novo já está sendo usado por outra conta.');
      return { tipo: 'email', email: u3.email, novo: u3.emailNovo, nome: u3.nome, precisaSenha: false };
    }
    if (a.acao === 'grupo') {
      var cg = T('ConvitesGrupo').all().filter(function (x) { return x.token === t; })[0];
      if (!cg || cg.usadoEm) erro('Este convite para criar grupo já foi usado. Se você já criou o grupo, basta entrar com seu e-mail e senha.');
      if (new Date(cg.expira).getTime() < Date.now()) erro('Este convite expirou. Peça um novo ao administrador geral.');
      var ul = usuario(cg.email);
      return { tipo: 'grupo', email: cg.email, nome: ul ? ul.nome : cg.nome, nomeGrupo: cg.nomeGrupo, precisaSenha: !ul || !ul.senhaHash };
    }
    if (a.acao === 'recebi') {
      var m2 = T('Membros').all().filter(function (x) { return x.tokenRecebido === t; })[0];
      if (!m2) erro('Link inválido.');
      if (!m2.sorteioRecebidoEm) T('Membros').update(function (x) { return x.tokenRecebido === t; }, { sorteioRecebidoEm: agora() });
      var g2 = grupo(m2.grupoId);
      return { tipo: 'recebi', grupo: g2 ? g2.nome : '' };
    }
    erro('Link inválido.');
  };

  api.confirmarLink = function (a) {
    var info = api.lerLink(a), senha = String(a.senha || '');
    if (info.tipo === 'grupo') {
      var nomeGrupo = String(a.nomeGrupo || info.nomeGrupo || '').trim().substr(0, 80);
      if (!nomeGrupo) erro('Dê um nome ao seu grupo.');
      if (info.precisaSenha && senha.length < 6) erro('A senha precisa ter pelo menos 6 caracteres.');
      if (!usuario(info.email)) T('Usuarios').insert({ email: info.email, nome: info.nome, telefone: '', foto: '', senhaHash: '', salt: '', ativo: 'nao', tokenSenha: '', tokenSenhaExpira: '', criadoEm: agora(), ultimoAcesso: '' });
    }
    if (info.precisaSenha) {
      if (senha.length < 6) erro('A senha precisa ter pelo menos 6 caracteres.');
      var salt = Cripto.hex(P.bytesAleatorios(16));
      T('Usuarios').update(function (x) { return x.email === info.email; }, { salt: salt, senhaHash: Cripto.hashSenha(senha, salt), ativo: 'sim', tokenSenha: '', tokenSenhaExpira: '' });
    }
    if (info.tipo === 'convite') {
      var mc = T('Membros').all().filter(function (x) { return x.tokenConvite === a.t; })[0];
      T('Membros').update(function (x) { return x.tokenConvite === a.t; }, { confirmado: agora(), tokenConvite: '' });
      T('Usuarios').update(function (x) { return x.email === info.email; }, { ativo: 'sim' });
      var gc = mc ? grupo(mc.grupoId) : null;
      if (gc) {
        var ms2 = membros(gc.id), conf = ms2.filter(function (k) { return k.confirmado; }).length;
        lista(gc.admins).filter(function (e) { return e !== info.email; }).forEach(function (e) {
          avisar(e, 'Participação confirmada', nomeDe(info.email) + ' confirmou no ' + gc.nome + ' (' + conf + ' de ' + ms2.length + ').');
        });
      }
    }
    if (info.tipo === 'grupo') {
      T('Usuarios').update(function (x) { return x.email === info.email; }, { ativo: 'sim' });
      var gidNovo = novoGrupo(nomeGrupo, info.email, info.email);
      T('ConvitesGrupo').update(function (x) { return x.token === a.t; }, { usadoEm: agora(), grupoId: gidNovo });
      P.superadmins().map(norm).filter(function (e) { return e && e !== info.email; }).forEach(function (e) {
        avisar(e, 'Novo grupo criado 🎄', nomeDe(info.email) + ' criou o grupo "' + nomeGrupo + '" e já é o administrador dele.');
      });
      log(info.email, 'criou-grupo-por-convite', nomeGrupo);
      return { token: criarSessao(info.email), grupoId: gidNovo };
    }
    if (info.tipo === 'email') {
      trocarEmail(info.email, info.novo);
      log(info.novo, 'trocou-email', info.email + ' -> ' + info.novo);
      avisar(info.novo, 'E-mail alterado', 'Seu e-mail de acesso agora é ' + info.novo + '.');
      return { token: criarSessao(info.novo) };
    }
    log(info.email, 'confirmou-' + info.tipo);
    return { token: criarSessao(info.email) };
  };

  /* ---------- troca de e-mail (com confirmação no e-mail novo) ---------- */
  function trocarEmail(velho, novo) {
    velho = norm(velho); novo = norm(novo);
    function troca(e) { return e === velho ? novo : e; }
    T('Usuarios').update(function (u) { return u.email === velho; }, { email: novo, emailNovo: '', tokenEmail: '', tokenEmailExpira: '' });
    T('Membros').update(function (m) { return m.email === velho; }, { email: novo });
    T('Sessoes').update(function (x) { return x.email === velho; }, { email: novo });
    T('Grupos').all().forEach(function (g) {
      var p = {}, ads = lista(g.admins);
      if (ads.indexOf(velho) >= 0) p.admins = ads.map(troca).join(',');
      if (norm(g.auditor) === velho) p.auditor = novo;
      if (Object.keys(p).length) T('Grupos').update(function (k) { return k.id === g.id; }, p);
    });
    // dados cifrados: sorteio, conversas, recados do mural e compras de escolha
    T('Sorteios').all().forEach(function (r) {
      var d = Cripto.decifrar(r.dados); if (!d || d.ordem.indexOf(velho) < 0) return;
      d.ordem = d.ordem.map(troca);
      T('Sorteios').update(function (k) { return k.grupoId === r.grupoId; }, { dados: Cripto.cifrar(d) });
    });
    T('Conversas').all().forEach(function (r) {
      var d = Cripto.decifrar(r.dados); if (!d || (d.a !== velho && d.b !== velho)) return;
      d.a = troca(d.a); d.b = troca(d.b);
      T('Conversas').update(function (k) { return k.id === r.id; }, { dados: Cripto.cifrar(d) });
    });
    T('Mensagens').all().filter(function (r) { return r.conversaId === 'MURAL'; }).forEach(function (r) {
      var d = Cripto.decifrar(r.dados); if (!d || d.autor !== velho) return;
      d.autor = novo;
      T('Mensagens').update(function (k) { return k.id === r.id; }, { dados: Cripto.cifrar(d) });
    });
    T('Compras').all().forEach(function (r) {
      var p = {}, c = Cripto.decifrar(r.comprador), e = r.escolha ? Cripto.decifrar(r.escolha) : null;
      if (c && c.e === velho) p.comprador = Cripto.cifrar({ e: novo });
      if (e && e.e === velho) p.escolha = Cripto.cifrar({ e: novo });
      if (e && (e.a === velho || e.b === velho)) p.escolha = Cripto.cifrar({ a: e.a === velho ? novo : e.a, b: e.b === velho ? novo : e.b });
      if (Object.keys(p).length) T('Compras').update(function (k) { return k.id === r.id; }, p);
    });
    if (P.trocarSuperadmin && ehSuper(velho)) P.trocarSuperadmin(velho, novo);
  }
  function pedirTroca(alvo, novo, quemPediu) {
    novo = norm(novo);
    if (!emailValido(novo)) erro('E-mail inválido.');
    if (ficticio(novo)) erro('Use um e-mail verdadeiro.');
    if (novo === alvo.email) erro('Esse já é o e-mail atual.');
    if (usuario(novo)) erro('Esse e-mail já está sendo usado por outra conta.');
    var tk = Cripto.token();
    T('Usuarios').update(function (x) { return x.email === alvo.email; }, { emailNovo: novo, tokenEmail: tk, tokenEmailExpira: new Date(Date.now() + 3 * 864e5).toISOString() });
    var porAdmin = quemPediu && quemPediu !== alvo.email;
    var r = P.enviarEmail({ para: novo, assunto: APP_NOME + ': confirme seu novo e-mail', html: moldura('Confirme seu novo e-mail',
      '<p>Olá, <b>' + esc(alvo.nome) + '</b>!</p><p>' + (porAdmin ? esc(nomeDe(quemPediu)) + ', administrador do amigo secreto, pediu' : 'Você pediu') + ' para trocar o e-mail de acesso ao ' + APP_NOME + ' de <b>' + esc(alvo.email) + '</b> para <b>' + esc(novo) + '</b>.</p>' +
      '<p>Clique abaixo para confirmar. Sua senha, foto, sugestões, conversas e amigo secreto continuam iguais.</p>' + botao(link('email', tk), 'Confirmar novo e-mail') +
      '<p style="font-size:13px;color:#8a8370">O link vale por 3 dias. Se você não pediu essa troca, ignore este e-mail.</p>') });
    if (!r.ok) erro('Não foi possível enviar o e-mail de confirmação: ' + r.erro);
    if (alvo.senhaHash && !ficticio(alvo.email)) P.enviarEmail({ para: alvo.email, assunto: APP_NOME + ': pedido de troca de e-mail', html: moldura('Pedido de troca de e-mail',
      '<p>Olá, <b>' + esc(alvo.nome) + '</b>!</p><p>Foi pedida a troca do seu e-mail de acesso para <b>' + esc(novo) + '</b>. A troca só acontece quando alguém clicar no link enviado para esse endereço novo.</p><p>Se não foi você nem o administrador, avise o administrador do grupo.</p>') });
    log(quemPediu, 'pediu-troca-email', alvo.email + ' -> ' + novo);
    return 'Enviamos um link de confirmação para ' + novo + '. A troca acontece quando o link for clicado.';
  }
  api.trocarMeuEmail = function (a) {
    var u = sessao(a.token);
    if (a.cancelar) { T('Usuarios').update(function (x) { return x.email === u.email; }, { emailNovo: '', tokenEmail: '', tokenEmailExpira: '' }); return api.eu(a); }
    pedirTroca(u, a.novo, u.email);
    return api.eu(a);
  };
  api.adminTrocarEmail = function (a) {
    var u = sessao(a.token), x = exigirAdmin(u, a.grupoId), alvo = usuario(a.email);
    if (!alvo || !membro(x.g.id, alvo.email)) erro('Participante não encontrado.');
    var msg = pedirTroca(alvo, a.novo, u.email);
    return { mensagem: msg, grupo: api.grupo(a) };
  };

  /* ---------- minha conta ---------- */
  function pendenciasGeral() {
    var gs = T('Grupos').all(), r = { suporte: 0, pedidosGrupo: 0, compras: 0, devolucoes: 0 };

/* Marca: três flechas formando um círculo (o círculo do sorteio), com uma estrela no centro */
function marca(cor, estrela){
  var cx=32, cy=32, r=22, p='', h='';
  [[-80,25],[40,145],[160,265]].forEach(function(a){
    var a0=a[0]*Math.PI/180, a1=a[1]*Math.PI/180;
    var x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    p+='<path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+r+' '+r+' 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+'"/>';
    var tx=-Math.sin(a1), ty=Math.cos(a1), nx=Math.cos(a1), ny=Math.sin(a1);
    var bx=x1-7*tx, by=y1-7*ty;
    h+='<path d="M'+(bx+5*nx).toFixed(1)+' '+(by+5*ny).toFixed(1)+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+' L'+(bx-5*nx).toFixed(1)+' '+(by-5*ny).toFixed(1)+'"/>';
  });
  var est='';
  if(estrela!==false){ var pts=[]; for(var i=0;i<10;i++){ var rr=i%2?3.6:8.5, an=(-90+i*36)*Math.PI/180; pts.push((cx+rr*Math.cos(an)).toFixed(1)+','+(cy+rr*Math.sin(an)).toFixed(1)); } est='<polygon points="'+pts.join(' ')+'" fill="'+(estrela||'#e2b65e')+'" stroke="none"/>'; }
  return '<svg viewBox="0 0 64 64" fill="none" stroke="'+(cor||'currentColor')+'" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+h+est+'</svg>';
}

/* Conversa em fio dentro de um cartão (suporte e mensagens com a administração).

        apagar:function(){ Promise.resolve(cfg.apagar(m.id)).then(function(n){ itens=n; if(resp===m.id) resp=null; desenhar(); aviso('Mensagem apagada.'); }).catch(falha); }
      }); }; });

function ocupado(btn, fn){ if(btn.disabled) return; var t=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="giro" style="width:16px;height:16px;border-width:2px"></span>'; return Promise.resolve().then(fn).catch(falha).then(function(r){ btn.disabled=false; btn.innerHTML=t; return r; }); }

/* ---------- imagens (foto e logo) ---------- */
function lerImagem(arquivo, lado, quadrada){
  return new Promise(function(res, rej){
    if(!arquivo || !/^image\//.test(arquivo.type)) return rej(new Error('Escolha uma imagem (JPG ou PNG).'));
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.width, h=img.height, sx=0, sy=0, sw=w, sh=h;
        if(quadrada){ var m=Math.min(w,h); sx=(w-m)/2; sy=(h-m)/2; sw=sh=m; }
        var lado2=lado, q=0.82, url;
        for(var t=0;t<8;t++){
          var esc2=Math.min(1, lado2/Math.max(sw,sh)), cw=Math.round(sw*esc2), ch=Math.round(sh*esc2);
          var c=document.createElement('canvas'); c.width=cw; c.height=ch;
          var cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cw,ch); cx.drawImage(img,sx,sy,sw,sh,0,0,cw,ch);
          url=c.toDataURL('image/jpeg', q);
          if(url.length<44000) return res(url);
          q-=0.1; if(q<0.45){ q=0.7; lado2=Math.round(lado2*0.8); }
        }
        rej(new Error('Não consegui reduzir a imagem. Tente outra.'));
      };
      img.onerror=function(){ rej(new Error('Imagem inválida.')); };
      img.src=fr.result;
    };
    fr.readAsDataURL(arquivo);
  });
}

function entrou(r){ S.token=r.token; lsSet('flecha-token', r.token); return iniciar(); }
function sair(silencioso){
  var t=S.token; S.token=null; S.eu=null; S.g=null; lsSet('flecha-token', null); falarPortal({flecha:'push-sair'}); pushLigado=''; limparCache(); lsSet('flecha-cache', null);

}

/* ---------- início após login ---------- */
function lerCacheGuardado(){ try{ var c=JSON.parse(lsGet('flecha-cache')||'null'); return c && c.v===1? c : null; }catch(e){ return null; } }
var tGuardaCache=null;
function guardarCache(){
  clearTimeout(tGuardaCache); tGuardaCache=setTimeout(function(){
    if(!S.token || !S.gid || !S.g || !S.eu) return;
    var abas={}; Object.keys(CACHE).forEach(function(k){ if(k.split(':')[1]===S.gid) abas[k]=CACHE[k].d; });
    var j=JSON.stringify({v:1, gid:S.gid, eu:S.eu, g:S.g, abas:abas}); if(j.length<1500000) lsSet('flecha-cache', j);
  }, 1200);
}
function aplicarPacote(r, gid){
  S.eu=r.eu; ligarPush(r.eu);
  if(r.meuAmigo) CACHE['amigo:'+gid]={d:r.meuAmigo, j:JSON.stringify(r.meuAmigo)};
  if(r.conversas){ CACHE['conv:'+gid]={d:r.conversas, j:JSON.stringify(r.conversas)}; }
  if(r.mural) CACHE['mural:'+gid]={d:r.mural, j:JSON.stringify(r.mural)};
}
function prepararAba(g){
  if(['admin'].indexOf(S.aba)>=0 && !g.souAdmin) S.aba='amigo'; if(S.aba==='auditor' && !g.souAuditor) S.aba='amigo';
  if(g.suporte && ['amigo','conversas','mural'].indexOf(S.aba)>=0) S.aba='admin';
}
function grupoAberto(g){
  if(g.boasVindas && g.boasVindas.length && !window.__SEM_BOAS_VINDAS__) mostrarBoasVindas(g.boasVindas);
  if(S.eu && S.eu.pendencias && S.eu.pendencias.total) setTimeout(function(){ aviso('Há '+S.eu.pendencias.total+' pendência(s) aguardando você como administrador geral.'); }, 900);
  preCarregarAbas(); guardarCache();
}
function iniciar(){
  var c=lerCacheGuardado();
  // abre na hora com o que ficou guardada da última vez e atualiza em seguida
  if(c && S.gid && c.gid===S.gid && c.eu && c.g){
    S.eu=c.eu; S.g=c.g; CACHE={}; Object.keys(c.abas||{}).forEach(function(k){ CACHE[k]={d:c.abas[k], j:JSON.stringify(c.abas[k])}; });
    prepararAba(S.g); desenharGrupo();
    var gid=S.gid, seq=seqAba;
    chamar('pacote',{grupoId:gid}).then(function(r){
      if(S.gid!==gid) return;
      if(!r.grupo){ S.gid=null; lsSet('flecha-grupo',null); return iniciar(); }
      var mudouAba = JSON.stringify(r[{amigo:'meuAmigo',conversas:'conversas',mural:'mural'}[S.aba]]||null) !== JSON.stringify(((CACHE[{amigo:'amigo',conversas:'conv',mural:'mural'}[S.aba]+':'+gid])||{}).d||null);
      var mudouGrupo = JSON.stringify(r.grupo)!==JSON.stringify(S.g);
      aplicarPacote(r, gid); S.g=r.grupo; prepararAba(S.g);
      if(mudouGrupo){ desenharCabecalho(); desenharAbas(); }
      if((mudouAba || (mudouGrupo && ['participantes','admin','amigo'].indexOf(S.aba)>=0)) && seq===seqAba && !mexeu && !document.querySelector('.modal-fundo') && !S.conv){
        var rev=$('#bil-r'); if(!(rev && !rev.hidden)) mostrarAba(S.aba);
      }
      grupoAberto(S.g);
    }).catch(function(e){ if(S.token) falha(e); });
    return Promise.resolve();
  }
  app.innerHTML=carregando();
  return chamar('pacote',{grupoId:S.gid||''}).then(function(r){
    S.eu=r.eu;
    if(r.grupo){ aplicarPacote(r, S.gid); S.g=r.grupo; prepararAba(S.g); desenharGrupo(); grupoAberto(S.g); return; }
    var eu=r.eu;
    if(eu.grupos.length===1) return abrirGrupo(eu.grupos[0].id);
    if(eu.pendencias && eu.pendencias.total) setTimeout(function(){ aviso('Há '+eu.pendencias.total+' pendência(s) aguardando você como administrador geral.'); }, 900);
    telaGrupos();
  }).catch(function(e){ if(S.token) falha(e); });
}

function textoPendencias(pd){
  var t=[];
  if(pd.suporte) t.push(pd.suporte+' mensagem(ns) de suporte');
  if(pd.pedidosGrupo) t.push(pd.pedidosGrupo+' pedido(s) de novo grupo');
  if(pd.compras) t.push(pd.compras+' compra(s) de escolha para conferir');
  if(pd.devolucoes) t.push(pd.devolucoes+' devolução(ões) para registrar');
  return t.length>1? t.slice(0,-1).join(', ')+' e '+t[t.length-1] : (t[0]||'');
}

  app.innerHTML='<header class="topo"><div class="wrap"><div class="logo">'+marca('#f3ead2')+'</div><div class="tit"><h1>Flecha Secreta</h1><div class="linha2">Olá, '+esc(eu.nome)+(eu.superadmin?' · administrador geral':'')+'</div></div><button class="icobtn" id="g-perfil" aria-label="Meu perfil">'+I.eu+'</button><button class="icobtn sair-topo" id="g-sair" aria-label="Sair da conta">'+I.sair+'<span>Sair</span></button></div></header>'+

function abrirGrupo(gid){

    .catch(function(e){ falha(e); S.gid=null; lsSet('flecha-grupo',null); telaGrupos(); });
}

/* ---------- velocidade: cada aba abre na hora com o que já foi carregado e se atualiza em segundo plano ---------- */
var CACHE={}, seqAba=0, mexeu=false, tNaoLidas=null;
function limparCache(){ CACHE={}; }
function usarCache(ch, nome, args, desenhar, podeAtualizar){
  var seq=seqAba, em=CACHE[ch];
  if(em) desenhar(em.d, true);
  return chamar(nome, args).then(function(d){
    var j=JSON.stringify(d), mudou=!em || em.j!==j; CACHE[ch]={d:d, j:j}; if(mudou) guardarCache();
    if(seq!==seqAba) return;
    if(!em) return desenhar(d, false);
    if(mudou && !mexeu && !document.querySelector('.modal-fundo') && (!podeAtualizar || podeAtualizar())) desenhar(d, false);
  }).catch(function(e){ if(!em && seq===seqAba) falha(e); });
}
function preCarregar(ch, nome, args){
  if(CACHE[ch]) return Promise.resolve(CACHE[ch].d);
  return chamar(nome, args).then(function(d){ CACHE[ch]={d:d, j:JSON.stringify(d)}; return d; }).catch(function(){ return null; });
}
function preCarregarAbas(){
  var gid=S.gid, g=S.g; if(!gid || !g || g.suporte) return;
  setTimeout(function(){
    if(S.gid!==gid) return;
    preCarregar('amigo:'+gid,'meuAmigo',{grupoId:gid})
      .then(function(){ return S.gid===gid && preCarregar('conv:'+gid,'conversas',{grupoId:gid}).then(marcarNaoLidas); })
      .then(function(){ return S.gid===gid && preCarregar('mural:'+gid,'mural',{grupoId:gid}); });
  }, 700);
  if(!tNaoLidas) tNaoLidas=setInterval(function(){ if(!document.hidden && S.gid && $('#bol-conv') && S.aba!=='conversas') verificarNaoLidas(); }, 90000);
}

function ligarCopias(r){ $$('[data-copiar]', r).forEach(function(b){ b.onclick=function(){ var t=b.dataset.copiar; try{ navigator.clipboard.writeText(t).then(function(){ aviso('Copiado.'); }, function(){ aviso(t); }); }catch(e){ aviso(t); } }; }); }
function carregarCompra(box){
  box.innerHTML=carregando();

    var cc=$('#cp-canc',box); if(cc) cc.onclick=function(){ confirmar('Cancelar o pedido?','O administrador geral será avisado. Se você já fez o PIX, ele vai conferir e, comprovado o pagamento, devolver o valor para você.','Cancelar pedido').then(function(ok){ if(ok) ocupado(cc, function(){ return chamar('cancelarPedido',{grupoId:S.gid}).then(function(){ aviso('Pedido cancelado. O administrador geral foi avisado.'); carregarCompra(box); }); }); }); };

      '<div class="muted" style="font-size:13px">Sigilo: ninguém fica sabendo que foi você, nem o par, nem os administradores. Só você saberá, então guarde segredo! As vagas são limitadas e o valor ajuda a bancar a festa.</div><button class="btn" id="ab-quero">🤗 Quero dar um Abraço Garantido</button></div>';
  }
  return h;
}
function ligarAbraco(box, c){
  var ab=c.abraco; if(!ab) return;
  var q=$('#ab-quero',box); if(q) q.onclick=function(){
    modal('<h2>Abraço Garantido</h2><div>Faça um PIX de <b>'+esc(ab.valor)+'</b> e depois toque em “Já fiz o PIX”.</div><div class="cartao pilha">'+linhaCopia('Chave PIX', c.pix)+linhaCopia('Titular', c.titular)+linhaCopia('Banco', c.banco)+linhaCopia('Agência', c.agencia)+linhaCopia('Conta', c.conta)+'</div><div class="muted" style="font-size:13px">Depois que o administrador geral confirmar o pagamento, você escolhe o par aqui mesmo. Se as vagas se esgotarem antes, o valor é devolvido.</div><div class="linha-acoes" style="justify-content:flex-end"><button class="btn sec" data-fechar>Agora não</button><button class="btn" id="ab-paguei">Já fiz o PIX, avisar</button></div>', function(m, fechar){
      ligarCopias(m);
      $('#ab-paguei',m).onclick=function(){ ocupado(this, function(){ return chamar('pedirCompra',{grupoId:S.gid, tipo:'abraco'}).then(function(){ fechar(); aviso('Pedido enviado ao administrador geral.'); carregarCompra(box); }); }); };
    });
  };
  var cc=$('#ab-canc',box); if(cc) cc.onclick=function(){ confirmar('Cancelar o pedido?','O administrador geral será avisado. Se você já fez o PIX, ele vai conferir e, comprovado o pagamento, devolver o valor para você.','Cancelar pedido').then(function(ok){ if(ok) ocupado(cc, function(){ return chamar('cancelarPedido',{grupoId:S.gid, tipo:'abraco'}).then(function(){ aviso('Pedido cancelado. O administrador geral foi avisado.'); carregarCompra(box); }); }); }); };
  var ce=$('#ab-esc',box); if(ce) ce.onclick=function(){
    var sa=$('#ab-a',box), sb=$('#ab-b',box);
    if(!sa.value || !sb.value) return aviso('Escolha as duas pessoas.', true);
    if(sa.value===sb.value) return aviso('Escolha duas pessoas diferentes.', true);
    var na=sa.options[sa.selectedIndex].text, nb=sb.options[sb.selectedIndex].text;
    confirmar(na+' vai tirar '+nb+'?', 'O par é definitivo e o sorteio vai respeitá-lo. Ninguém saberá que foi você.', 'Confirmar o par').then(function(ok){

/* ---------- aba: conversas ---------- */
var tAtualiza=null;
function pararAtualizacao(){ clearInterval(tAtualiza); tAtualiza=null; }
function vistos(){ try{ return JSON.parse(lsGet('flecha-vistos')||'{}'); }catch(e){ return {}; } }
function marcarVisto(id, em){ var v=vistos(); v[id]=em||new Date().toISOString(); lsSet('flecha-vistos', JSON.stringify(v)); }
function naoLida(k){ var v=vistos(); return k.ultima && !k.ultima.minha && (!v[k.id] || v[k.id] < k.ultima.em); }
function marcarNaoLidas(cs){ var b=$('#bol-conv'); if(b && cs) b.hidden=!cs.some(naoLida); }
function verificarNaoLidas(){ if(!S.gid) return; var gid=S.gid; chamar('conversas',{grupoId:gid}).then(function(cs){ CACHE['conv:'+gid]={d:cs, j:JSON.stringify(cs)}; marcarNaoLidas(cs); }).catch(function(){}); }

function abaConversas(c){
  if(S.conv) return abrirConversa(c, S.conv);
  usarCache('conv:'+S.gid,'conversas',{grupoId:S.gid}, function(cs){
    marcarNaoLidas(cs);
    var h='<div class="secao"><div class="linha-acoes" style="justify-content:space-between"><h2>Conversas</h2><button class="btn peq" id="cv-nova">'+I.balao+'Nova mensagem</button></div>';
    if(!S.g.sorteado) h+='<div class="faixa info">Depois do sorteio aparecem aqui duas conversas especiais: com o seu amigo secreto (ele não sabe que é você) e com quem tirou você (você não sabe quem é).</div>';
    h+= cs.length? '<div class="lista">'+cs.map(function(k){
      var av = k.foto? '<img class="av" '+imgAttrs(k.foto)+' alt="">' : (k.icone==='presente'||k.icone==='mascara')? avatarIcone(k.icone) : avatar('',k.titulo);
      return '<button class="item" data-c="'+esc(k.id)+'">'+av+'<div class="txt"><div class="t1">'+(k.tipo==='amigo'&&k.ordem===0?'<span class="chip ouro">meu amigo</span>':'')+esc(k.titulo)+'</div><div class="t2">'+(k.ultima? (k.ultima.minha?'Você: ':'')+esc(k.ultima.texto) : esc(k.subtitulo))+'</div></div>'+(k.ultima?'<span class="hora">'+quando(k.ultima.em)+'</span>':'')+(naoLida(k)?'<span class="ponto" aria-label="não lida"></span>':'')+'</button>';
    }).join('')+'</div>' : '<div class="cartao muted">Nenhuma conversa ainda. Toque em “Nova mensagem” para escrever para alguém, de forma aberta ou anônima.</div>';
    h+='</div>';
    c.innerHTML=h;
    $$('[data-c]').forEach(function(b){ b.onclick=function(){ S.conv=b.dataset.c; abrirConversa(c, S.conv); }; });
    $('#cv-nova').onclick=novaMensagem;
  });
}
function novaMensagem(){
  var atalhos=[{ic:'mural', t:'Todos', s:'Mensagem no mural do grupo', ir:'mural'}];
  if(!S.g.sorteado) return abrirNovaMensagem(atalhos);
  chamar('conversas',{grupoId:S.gid}).then(function(cs){
    var meu=cs.filter(function(k){return k.tipo==='amigo'&&k.ordem===0;})[0], tirou=cs.filter(function(k){return k.tipo==='amigo'&&k.ordem===1;})[0];
    var lst=[];
    if(meu) lst.push({ic:'alvo', t:'Meu amigo secreto ('+meu.titulo+')', s:'Ele não sabe que é você', conv:meu.id});
    if(tirou) lst.push({ic:'presente', t:'Quem me tirou', s:'Você não sabe quem é', conv:tirou.id});
    abrirNovaMensagem(lst.concat(atalhos));
  }).catch(function(){ abrirNovaMensagem(atalhos); });
}
function abrirNovaMensagem(atalhos){
  var ps=S.g.participantes.filter(function(p){ return !p.eu; });
  modal('<h2>Nova mensagem</h2><div class="lista">'+atalhos.map(function(a,i){ return '<button class="item" data-at="'+i+'">'+avatarIcone(a.ic)+'<div class="txt"><div class="t1">'+esc(a.t)+'</div><div class="t2">'+esc(a.s)+'</div></div></button>'; }).join('')+'</div><div class="rotulo" style="margin-top:4px">Ou escreva para uma pessoa</div><label class="campo">Para<select class="inp" id="nm-para">'+ps.map(function(p){ return '<option value="'+esc(p.email||p.id)+'">'+esc(p.nome)+'</option>'; }).join('')+'</select></label>'+
    '<div class="campo" style="font-size:13px;font-weight:600;color:var(--tinta-2)">Como você quer aparecer?<div class="alternar" role="group"><button type="button" aria-pressed="true" data-an="0">Com meu nome</button><button type="button" aria-pressed="false" data-an="1">Anônimo</button></div></div>'+
    '<div class="muted" style="font-size:13px" id="nm-exp">A pessoa verá seu nome.</div>'+
    '<div class="linha-acoes" style="justify-content:flex-end"><button class="btn sec" data-fechar>Cancelar</button><button class="btn" id="nm-ok">Abrir conversa</button></div>', function(m, fechar){
    var anon=false;
    $$('[data-at]',m).forEach(function(b){ b.onclick=function(){ var a=atalhos[+b.dataset.at]; fechar(); if(a.conv){ S.conv=a.conv; mostrarAba('conversas'); } else { mostrarAba('mural'); setTimeout(function(){ var t=$('#mu-t'); if(t) t.focus(); }, 700); } }; });
    $$('[data-an]',m).forEach(function(b){ b.onclick=function(){ anon=b.dataset.an==='1'; $$('[data-an]',m).forEach(function(x){ x.setAttribute('aria-pressed', x===b); }); $('#nm-exp',m).textContent= anon? 'A pessoa verá “Remetente anônimo”. Ninguém, nem o administrador, saberá que foi você.' : 'A pessoa verá seu nome.'; }; });
    function abrir(b){ ocupado(b, function(){ return chamar('novaConversa',{grupoId:S.gid, para:$('#nm-para',m).value, anonimo:anon}).then(function(r){ fechar(); S.conv=r.id; mostrarAba('conversas'); }); }); }
    $('#nm-ok',m).onclick=function(){ var b=this, v=$('#nm-para',m).value, alvo=ps.filter(function(p){ return (p.email||p.id)===v; })[0];
      if(alvo && !alvo.confirmou){
        confirmar(alvo.nome+' ainda não confirmou', esc(alvo.nome)+' ainda não confirmou a participação no grupo e, por isso, ainda não consegue entrar no aplicativo para ler mensagens. A mensagem fica guardada e poderá ser lida depois da confirmação.<br><br>Quer escrever mesmo assim?', 'Escrever mesmo assim').then(function(ok){ if(ok) abrir(b); });
        return;
      }
      abrir(b); };
  });
}
function abrirConversa(c, id){
  var resp=null, ultimo=null, avisado=false;
  function citacaoHTML(r){ return r? (r.apagada? '<div class="citacao">Respondendo a uma mensagem apagada</div>' : '<div class="citacao">'+esc(r.autor)+': “'+esc(r.texto)+'”</div>') : ''; }
  function mostrarResp(){
    var box=$('#cv-resp'); if(!box) return;
    var m = resp && ultimo? ultimo.itens.filter(function(k){ return k.id===resp; })[0] : null;
    if(!m){ resp=null; box.hidden=true; box.innerHTML=''; $('#cv-t').placeholder='Escreva uma mensagem'; return; }
    box.hidden=false;
    box.innerHTML='<div class="citacao"><div>Respondendo a <b>'+esc(m.autor)+'</b>: “'+esc(String(m.texto).slice(0,120))+(m.texto.length>120?'…':'')+'”</div><button type="button" class="link" id="cv-xr" aria-label="Cancelar resposta" style="padding:0 2px">✕</button></div>';
    $('#cv-t').placeholder='Escreva sua resposta…';
    $('#cv-xr').onclick=function(){ resp=null; mostrarResp(); };
  }
  function acoes(m){
    menuMensagem(m, {
      responder:function(){ resp=m.id; mostrarResp(); var t=$('#cv-t'); if(t) t.focus(); },
      editar:function(v){ chamar('editarMensagem',{grupoId:S.gid, conversaId:id, id:m.id, texto:v}).then(function(d2){ desenhar(d2); aviso('Mensagem editada.'); }).catch(falha); },
      apagar:function(){ chamar('apagarMensagem',{grupoId:S.gid, conversaId:id, id:m.id}).then(function(d2){ if(resp===m.id) resp=null; desenhar(d2); mostrarResp(); aviso('Mensagem apagada.'); }).catch(falha); },
      textoApagar:'A mensagem some para você e para a outra pessoa.'
    });
  }
  function enviar(txt, b){
    var t=$('#cv-t');
    return ocupado(b, function(){ return chamar('enviarMensagem',{grupoId:S.gid, conversaId:id, texto:txt, respostaA:resp||''}).then(function(d2){ t.value=''; if(t._ajusta) t._ajusta(); resp=null; mostrarResp(); desenhar(d2, false, true); }); });
  }
  function desenhar(d, primeira, rolar){
    ultimo=d;
    var chat=$('#chat');
    if(!chat){
      c.innerHTML='<div class="cab-conversa"><button class="btn sec peq" id="cv-volta" aria-label="Voltar">'+I.voltar+'</button>'+avatarIcone(d.icone==='alvo'?'alvo':d.icone)+'<div style="min-width:0"><div style="font-weight:700">'+esc(d.titulo)+'</div><div class="muted" style="font-size:13px">'+esc(d.subtitulo)+'</div></div></div>'+
        (d.outroPendente? '<div class="faixa aviso-f" style="margin-top:12px"><div><b>'+esc(d.nomeOutro)+' ainda não confirmou a participação.</b> As mensagens ficam guardadas e poderão ser lidas depois que a pessoa confirmar o convite.</div></div>' : '')+
        '<div class="dica-chat">Toque numa mensagem para responder, editar ou apagar.</div>'+
        '<div class="chat" id="chat"></div><div class="compor-wrap"><div id="cv-resp" hidden></div><form class="compor" id="cv-f"><textarea class="inp" id="cv-t" rows="1" placeholder="Escreva uma mensagem" maxlength="2000"></textarea><button class="btn" aria-label="Enviar">'+I.enviar+'</button></form></div>';
      chat=$('#chat');
      autoCrescer($('#cv-t'));
      $('#cv-volta').onclick=function(){ S.conv=null; pararAtualizacao(); abaConversas(c); };
      $('#cv-f').onsubmit=function(ev){ ev.preventDefault(); var t=$('#cv-t'), txt=t.value.trim(); if(!txt) return; var b=this.querySelector('button');
        if(ultimo && ultimo.outroPendente && !avisado){
          return confirmar(ultimo.nomeOutro+' ainda não confirmou', esc(ultimo.nomeOutro)+' ainda não confirmou a participação no grupo e, por isso, ainda não consegue entrar no aplicativo para ler. A mensagem fica guardada e poderá ser lida depois da confirmação.<br><br>Quer enviar mesmo assim?', 'Enviar mesmo assim').then(function(ok){ if(ok){ avisado=true; enviar(txt, b); } });
        }
        enviar(txt, b); };
      $('#cv-t').addEventListener('keydown', function(ev){ if(ev.key==='Enter' && !ev.shiftKey && window.innerWidth>700){ ev.preventDefault(); $('#cv-f').requestSubmit(); } });
      chat.addEventListener('click', function(ev){ var b=ev.target.closest('.bolha[data-m]'); if(!b || !ultimo) return; var m=ultimo.itens.filter(function(k){ return k.id===b.dataset.m; })[0]; if(m) acoes(m); });
    }
    var embaixo = primeira || rolar || (window.innerHeight+window.scrollY >= document.body.scrollHeight-80);
    chat.innerHTML = d.itens.length? d.itens.map(function(m){ return '<div class="bolha'+(m.minha?' minha':'')+'" data-m="'+esc(m.id)+'" role="button" tabindex="0">'+citacaoHTML(m.resposta)+esc(m.texto)+'<div class="meta">'+esc(m.autor)+' · '+quando(m.em)+(m.editado?' · editada':'')+'</div></div>'; }).join('') : '<div class="faixa info">Nenhuma mensagem ainda. '+(d.icone==='alvo'?'Seu amigo não saberá que é você.':d.icone==='presente'?'Quem tirou você está do outro lado, em segredo.':'')+'</div>';
    if(d.itens.length) marcarVisto(id, d.itens[d.itens.length-1].em);

      '<form class="cartao pilha" id="mu-f"><div id="mu-resp" hidden></div><textarea class="inp" id="mu-t" maxlength="2000" placeholder="Escreva para o grupo todo…"></textarea><div class="linha-acoes" style="justify-content:space-between"><div class="alternar" role="group" aria-label="Como publicar"><button type="button" aria-pressed="true" data-an="0">Com meu nome</button><button type="button" aria-pressed="false" data-an="1">Anônimo</button></div><button class="btn" id="mu-pub">Publicar</button></div></form>'+
      '<div class="pilha" id="mu-l">'+(ps.length? ps.map(function(p){
        var cit = p.resposta? (p.resposta.apagada? '<div class="citacao">Respondendo a um recado que foi apagado</div>' : '<div class="citacao">Respondendo a <b>'+esc(p.resposta.autor)+'</b>: “'+esc(p.resposta.texto)+'”</div>') : '';
        return '<div class="cartao post'+(p.administrador?' admin':'')+'" id="post-'+esc(p.id)+'">'+(p.anonimo? avatarIcone('mascara') : avatar(p.foto,p.autor))+'<div class="corpo"><div class="linha-acoes" style="justify-content:space-between"><b>'+esc(p.autor)+(p.administrador?' <span class="chip ouro">'+I.escudo.replace('<svg','<svg width="13" height="13"')+' administrador</span>':'')+(p.minha&&p.anonimo?' <span class="chip">você, anônimo</span>':'')+'</b><span class="muted" style="font-size:12px">'+quando(p.em)+(p.editado?' · editada':'')+'</span></div>'+cit+'<div class="texto">'+esc(p.texto)+'</div>'+
          '<div class="linha-acoes" style="gap:14px"><button class="link" style="font-size:13px" data-resp="'+esc(p.id)+'">Responder</button>'+(p.podeEditar?'<button class="link" style="font-size:13px" data-ed="'+esc(p.id)+'">Editar</button>':'')+(p.podeApagar?'<button class="link" style="font-size:13px;color:var(--tinta-2)" data-del="'+esc(p.id)+'">Apagar</button>':'')+'</div></div></div>';
      }).join('') : '<div class="cartao muted">Ninguém escreveu ainda. Que tal começar com um recado para a família?</div>')+'</div></div>';
    function mostrarResp(){
      var box=$('#mu-resp',c);
      if(!resp){ box.hidden=true; box.innerHTML=''; $('#mu-t',c).placeholder='Escreva para o grupo todo…'; return; }
      var p=porId[resp]; box.hidden=false;
      box.innerHTML='<div class="citacao" style="display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-top:0"><div>Respondendo a <b>'+esc(p.autor)+'</b>: “'+esc(String(p.texto).slice(0,120))+(p.texto.length>120?'…':'')+'”</div><button type="button" class="link" id="mu-xr" aria-label="Cancelar resposta" style="padding:0 2px">✕</button></div>';

    $('#mu-f',c).onsubmit=function(ev){ ev.preventDefault(); var t=$('#mu-t',c).value.trim(); if(!t) return; ocupado($('#mu-pub',c), function(){ return chamar('publicarMural',{grupoId:S.gid, texto:t, anonimo:anon, respostaA:resp||''}).then(function(){ abaMural(c, true); aviso(resp?'Resposta publicada.':'Publicado.'); }); }); };
    autoCrescer($('#mu-t',c));

function mascaraTelefone(inp){
  inp.addEventListener('input', function(){ var d=inp.value.replace(/\D/g,'').slice(0,11), r=d;
    if(d.length>2) r='('+d.slice(0,2)+') '+d.slice(2); else if(d.length>0) r='('+d;
    if(d.length>6) r='('+d.slice(0,2)+') '+(d.length===11? d.slice(2,7)+'-'+d.slice(7) : d.slice(2,6)+'-'+d.slice(6));
    inp.value=r; });
}
function desenharAvisos(box){

  var eu=S.eu, papel=['quando chegar mensagem nas suas conversas','quando o sorteio for realizado','quando houver recado no mural','com lembretes da revelação'];

}

  if(p.ficticio) return '<span class="chip erro">e-mail fictício</span>';

  return '<span class="chip">sem convite</span>';

        if(er.length) modal('<h2>Inclusão</h2><p style="margin:0">'+ok.length+' incluído(s).</p><div class="pilha" style="gap:6px">'+er.map(function(x){ return '<div class="faixa aviso-f">'+esc(x.nome||x.email)+': '+esc(x.erro)+'</div>'; }).join('')+'</div><button class="btn" data-fechar>Fechar</button>');
        else aviso(ok.length+' participante(s) incluído(s).');
      }); });
    };
  });
}
function opcoesParticipante(c, p){
  var g=S.g;
  modal('<div class="revelado">'+avatar(p.foto,p.nome,'g')+'<div style="min-width:0"><h2>'+esc(p.nome)+'</h2><div class="mono muted" style="overflow-wrap:anywhere">'+esc(p.email)+'</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">'+statusPessoa(p)+statusSorteio(p)+'</div></div></div>'+
    '<div class="pilha" style="gap:8px">'+
    '<button class="btn sec" id="op-ed">Editar nome'+(p.confirmado?'':', e-mail')+' ou celular</button>'+
    (p.confirmado? '<button class="btn sec" id="op-em">Trocar e-mail (com confirmação)</button>':'')+
    (!p.confirmado && !p.ficticio? '<button class="btn sec" id="op-conv">Reenviar e-mail de confirmação</button>':'')+
    (g.sorteado && p.confirmado? '<button class="btn sec" id="op-res">Reenviar e-mail do sorteio para esta pessoa</button>':'')+
    '<button class="btn sec" id="op-adm">'+(p.admin?'Retirar de administrador':'Tornar administrador')+'</button>'+
    (S.g.sorteioTravado?'':'<button class="btn sec" id="op-rem" style="color:var(--erro)">Remover do grupo</button>')+
    '</div><button class="btn" data-fechar>Fechar</button>', function(m, fechar){
    function feito(g2, msg){ S.g=g2; fechar(); desenharCabecalho(); desenharAdmin(c); if(msg) aviso(msg); }
    $('#op-ed',m).onclick=function(){ fechar(); editarParticipante(c,p); };
    var oe=$('#op-em',m); if(oe) oe.onclick=function(){ fechar();
      modal('<h2>Trocar e-mail de '+esc(p.nome)+'</h2><div class="muted">'+esc(p.nome)+' receberá no e-mail novo um link para confirmar. A troca só acontece quando o link for clicado; senha, sugestões, conversas e amigo secreto continuam iguais.</div><div class="muted" style="font-size:13px">E-mail atual: <span class="mono">'+esc(p.email)+'</span></div>'+(p.emailNovo?'<div class="faixa aviso-f">Já há uma troca pendente para <b>'+esc(p.emailNovo)+'</b>. Um novo pedido substitui o anterior.</div>':'')+'<label class="campo">E-mail novo<input class="inp" id="ae-novo" type="email" inputmode="email"></label><div class="linha-acoes" style="justify-content:flex-end"><button class="btn sec" data-fechar>Cancelar</button><button class="btn" id="ae-ok">Enviar confirmação</button></div>', function(m2, f2){
        $('#ae-ok',m2).onclick=function(){ var novo=$('#ae-novo',m2).value.trim(); if(!novo) return aviso('Digite o e-mail novo.', true);
          ocupado(this, function(){ return chamar('adminTrocarEmail',{grupoId:S.gid, email:p.email, novo:novo}).then(function(r){ S.g=r.grupo; f2(); desenharAdmin(c); aviso(r.mensagem); }); }); };
      });
    };
    var cv=$('#op-conv',m); if(cv) cv.onclick=function(){ ocupado(cv, function(){ return chamar('reenviarConvite',{grupoId:S.gid,email:p.email}).then(function(r){ var x=r.resultado[0]; feito(r.grupo, x.ok?'Convite reenviado.':x.erro); }); }); };
    var rs=$('#op-res',m); if(rs) rs.onclick=function(){ ocupado(rs, function(){ return chamar('reenviarSorteio',{grupoId:S.gid,email:p.email}).then(function(r){ feito(r.grupo, 'E-mail do sorteio reenviado para '+p.nome+'.'); }); }); };
    $('#op-adm',m).onclick=function(){ var b=this; ocupado(b, function(){ return chamar('definirAdmin',{grupoId:S.gid,email:p.email,admin:!p.admin}).then(function(g2){ feito(g2, p.admin?'Deixou de ser administrador.':'Agora é administrador.'); }); }); };
    var orm=$('#op-rem',m); if(orm) orm.onclick=function(){ fechar(); confirmar('Remover '+p.nome+'?', g.sorteado? 'O sorteio já foi feito. Remover alguém <b>anula o sorteio</b> e será preciso sortear de novo.' : 'A pessoa sai do grupo e suas conversas neste grupo são apagadas.', 'Remover').then(function(s){ if(s) chamar('removerParticipante',{grupoId:S.gid,email:p.email,anularSorteio:true}).then(function(g2){ S.g=g2; desenharCabecalho(); desenharAdmin(c); aviso('Removido.'); }).catch(falha); }); };
  });
}
function editarParticipante(c, p){
  modal('<h2>Editar participante</h2><label class="campo">Nome<input class="inp" id="ep-n" value="'+esc(p.nome)+'"></label><label class="campo">E-mail<input class="inp" id="ep-e" type="email" value="'+esc(p.ficticio?'':p.email)+'" placeholder="'+esc(p.email)+'" '+(p.confirmado?'disabled':'')+'></label>'+(p.confirmado?'<div class="muted" style="font-size:13px">O e-mail já foi confirmado. Para trocar, use <b>Opções > Trocar e-mail (com confirmação)</b>.</div>':'')+'<label class="campo">Celular<input class="inp" id="ep-t" inputmode="tel" maxlength="15" placeholder="(99) 99999-9999" value="'+esc(p.telefone||'')+'"></label><div class="linha-acoes" style="justify-content:flex-end"><button class="btn sec" data-fechar>Cancelar</button><button class="btn" id="ep-ok">Salvar</button></div>', function(m, fechar){
    mascaraTelefone($('#ep-t',m));
    $('#ep-ok',m).onclick=function(){ var e=$('#ep-e',m).value.trim(); ocupado(this, function(){ return chamar('editarParticipante',{grupoId:S.gid, email:p.email, dados:{nome:$('#ep-n',m).value, telefone:$('#ep-t',m).value, email: e||p.email}}).then(function(g2){ S.g=g2; fechar(); desenharAdmin(c); aviso('Salvo.'+(e&&e!==p.email?' Agora envie o convite para testar o e-mail.':'')); }); }); };
  });
}

var P0 = window.__PARAMS__ || {};
app.innerHTML=carregando();
conectarPortal(function(){
