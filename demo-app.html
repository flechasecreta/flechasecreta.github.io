<script>
/* Painel exclusivo da demonstração */
(function(){
  var F = window.FLECHA, esc = F.esc;
  var b = document.createElement('button'); b.className = 'demo-btn'; b.textContent = 'Demo'; document.body.appendChild(b);
  b.onclick = abrir;
  /* demonstração pública: botão bem visível para sair e voltar à tela inicial do Flecha Secreta */
  var cfg = window.DEMO_CONFIG;
  if (cfg) {
    var sd = document.createElement('button'); sd.className = 'sair-demo'; sd.textContent = '← Sair da demonstração'; document.body.appendChild(sd);
    sd.onclick = function(){ F.confirmar('Sair da demonstração?', 'Você volta para a tela inicial do Flecha Secreta. O que você fez na demonstração continua guardado neste aparelho, se quiser voltar depois.', 'Sair').then(function(ok){ if(!ok) return; try{ window.top.location.href = cfg.inicio; }catch(e){ location.href = cfg.inicio; } }); };
  }
  function hojeReal(){ var s = DEMO.ler().dataSimulada; DEMO.ler().dataSimulada=''; var h = DEMO.hojeSP(); DEMO.ler().dataSimulada=s; return h; }
  function abrir(){
    var membrosG = DEMO.tab('Membros').map(function(m){ return m.email; });
    var geral = P.superadmins();
    var us = DEMO.tab('Usuarios').filter(function(u){ return membrosG.indexOf(u.email)>=0 || geral.indexOf(u.email)>=0; }).sort(function(a,b){ return a.nome.localeCompare(b.nome,'pt-BR'); });
    var g = DEMO.tab('Grupos')[0] || {}, sim = DEMO.ler().dataSimulada, caixa = DEMO.caixa();
    F.modal('<h2>Painel da demonstração</h2>'+
      '<div class="faixa info">Esta é uma simulação que roda só no seu navegador. Aqui você entra como qualquer participante sem senha; no aplicativo de verdade, cada um entra com a própria senha e os e-mails chegam na caixa de cada pessoa.</div>'+
      '<label class="campo">Entrar como outro participante<select class="inp" id="dm-u">'+us.map(function(u){ return '<option value="'+esc(u.email)+'"'+(u.ativo==='sim'?'':' disabled')+'>'+esc(u.nome)+(u.email===g.auditor?' (auditor)':'')+((g.admins||'').indexOf(u.email)>=0?' (admin)':'')+(geral.indexOf(u.email)>=0 && membrosG.indexOf(u.email)<0?' (administrador geral do aplicativo)':'')+(u.ativo==='sim'?'':' — convite pendente')+'</option>'; }).join('')+'</select></label>'+
      '<button class="btn mata" id="dm-entrar">Entrar como esta pessoa</button>'+
      '<div class="rotulo">Simular a data de hoje</div><div class="muted" style="font-size:13px;margin-top:-8px">Hoje simulado: <b>'+(sim? sim.split('-').reverse().join('/') : 'data real')+'</b>. A revelação está marcada para '+(g.dataRevelacao||'').split('-').reverse().join('/')+'.</div>'+
      '<div class="linha-acoes"><button class="btn sec peq" data-d="">Data real</button><button class="btn sec peq" data-d="rev">Dia da revelação</button><button class="btn sec peq" data-d="dep">Dia seguinte</button></div>'+
      '<button class="btn sec peq" id="dm-lemb">Simular os lembretes de hoje (Telegram)</button>'+
      '<div class="rotulo">Caixa de e-mails e avisos enviados ('+caixa.length+')</div>'+
      '<div class="lista" style="max-height:260px;overflow:auto">'+(caixa.length? caixa.map(function(m,i){ return '<button class="item" data-m="'+i+'"><div class="txt"><div class="t1" style="font-size:14px">'+esc(m.assunto)+'</div><div class="t2">para '+esc(m.para)+'</div></div></button>'; }).join('') : '<div class="item muted">Nenhum e-mail ainda. Faça o sorteio ou inclua alguém.</div>')+'</div>'+
      '<button class="btn sec" id="dm-inicio">Voltar à tela inicial da demonstração</button>'+
      (cfg? '<button class="btn sec" id="dm-sair">← Sair da demonstração</button>' : '')+
      '<div class="linha-acoes" style="justify-content:space-between"><button class="btn sec peq" id="dm-zerar">Recomeçar a demonstração</button><button class="btn" data-fechar>Fechar</button></div>',
    function(m, fechar){
      m.querySelector('#dm-entrar').onclick = function(){ var e = m.querySelector('#dm-u').value; Promise.resolve().then(function(){ return Core.entrarDemonstracao(e); }).then(function(r){ fechar(); F.S.token=r.token; try{localStorage.setItem('flecha-token', r.token);}catch(x){} F.S.aba='amigo'; F.S.conv=null; F.iniciar(); }).catch(function(e){ F.aviso(e.message,true); }); };
      Array.prototype.forEach.call(m.querySelectorAll('[data-d]'), function(x){ x.onclick = function(){ var d = x.dataset.d; DEMO.simularData(d==='rev'? g.dataRevelacao : d==='dep'? somaDia(g.dataRevelacao,1) : ''); fechar(); F.aviso('Data simulada alterada.'); if(F.S.token) F.iniciar(); }; });
      m.querySelector('#dm-lemb').onclick = function(){ var n = Core.lembretesDiarios(); fechar(); F.aviso(n? n+' lembrete(s) enviado(s). Veja na caixa do painel Demo.' : 'Hoje não é dia de lembrete (só 7 dias antes, na véspera e no dia). Mude a data simulada.'); };
      function limparSessao(){ ['flecha-token','flecha-grupo','flecha-aba','flecha-vistos'].forEach(function(k){ try{ F.lsSet(k, null); }catch(x){} try{ localStorage.removeItem(k); }catch(x){} }); F.S.token=null; F.S.gid=null; F.S.g=null; }
      m.querySelector('#dm-zerar').onclick = function(){ DEMO.reiniciar(); limparSessao(); fechar(); F.telaLogin('Demonstração reiniciada.'); };
      m.querySelector('#dm-inicio').onclick = function(){ limparSessao(); fechar(); F.telaLogin(); };
      var bs = m.querySelector('#dm-sair'); if (bs) bs.onclick = function(){ fechar(); document.querySelector('.sair-demo').click(); };
      Array.prototype.forEach.call(m.querySelectorAll('[data-m]'), function(x){ x.onclick = function(){ fechar(); verEmail(caixa[+x.dataset.m]); }; });
    });
  }
  function somaDia(iso,d){ var p=iso.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+d)).toISOString().substr(0,10); }
  function verEmail(m){
    F.modal('<div class="rotulo">E-mail simulado · para '+esc(m.para)+'</div><h2 style="font-size:18px">'+esc(m.assunto)+'</h2><div class="email-prev" id="em-c">'+m.html+'</div><div class="muted" style="font-size:12.5px">Os botões do e-mail funcionam aqui na demonstração.</div><button class="btn sec" data-fechar>Fechar</button>', function(box, fechar){
      Array.prototype.forEach.call(box.querySelectorAll('#em-c a'), function(a){
        a.addEventListener('click', function(ev){ ev.preventDefault(); var u = a.getAttribute('href'), ac = /acao=(\w+)/.exec(u), t = /t=([0-9a-f]+)/.exec(u);
          if(ac && t){ fechar(); F.telaLink({acao:ac[1], t:t[1]}); } });
      });
    });
  }
})();
</script>
