<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel CBIC</title>
<meta name="description" content="Painel financeiro da CBIC: fluxo de caixa, despesas, receitas e orçamento.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Painel CBIC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icone-32.png">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>
<body>
<div id="app" class="app">
  <header class="top">
    <img class="logo" src="cbic-logo-completo.png" alt="CBIC – Câmara Brasileira da Indústria da Construção">
    <div class="tt">
      <h1 id="titulo">Painel CBIC</h1>
      <button type="button" class="sub" id="escopo" aria-label="Período e filtros">—</button>
    </div>
    <button type="button" class="bfiltro" id="b-filtros" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg><span>Filtros</span><span class="cnt" id="f-cnt" hidden></span>
    </button>
  </header>
  <nav class="subtabs hs" id="subtabs" aria-label="Seções"></nav>
  <div class="chips hs" id="chips"></div>
  <main id="main" tabindex="-1"><div class="carregando" id="carregando"><span class="spin"></span>Carregando dados…</div></main>
  <nav class="tabbar" id="tabbar" aria-label="Áreas do painel">
    <button type="button" data-area="fluxo" style="--tc: var(--flx)"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18c3 0 4-6 7-6s3 3 5 3 3-7 6-9"/><circle cx="21" cy="6" r="1.2" fill="currentColor"/><path d="M3 21h18"/></svg></span><span>Fluxo</span></button>
    <button type="button" data-area="desp" style="--tc: var(--cbic)"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M16 13.5h2"/><path d="M7 7V5.5A1.5 1.5 0 0 1 8.5 4h7A1.5 1.5 0 0 1 17 5.5V7"/><path d="M12 10v6m-2.5-2.5L12 16l2.5-2.5"/></svg></span><span>Despesas</span></button>
    <button type="button" data-area="rec" style="--tc: var(--rec)"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9" cy="16" rx="6" ry="2.5"/><path d="M3 16v2.5C3 19.9 5.7 21 9 21s6-1.1 6-2.5V16"/><path d="M17 11V3m-3 3 3-3 3 3"/></svg></span><span>Receitas</span></button>
    <button type="button" data-area="orc" style="--tc: var(--orc)"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></span><span>Orçamento</span></button>
    <button type="button" data-area="ajuda" style="--tc: var(--aju)"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><circle cx="12" cy="17" r=".9" fill="currentColor"/></svg></span><span>Ajuda</span></button>
  </nav>
</div>

<div class="veu" id="veu" hidden></div>
<section class="sheet" id="sh-filtros" role="dialog" aria-modal="true" aria-labelledby="sh-filtros-t" hidden>
  <div class="sh-head"><h2 id="sh-filtros-t">Filtros</h2><button type="button" class="link" id="f-limpar">Limpar</button><button type="button" class="ibtn" data-fecha aria-label="Fechar">×</button></div>
  <div class="sh-body">
    <div class="fbloco"><span class="flab">Grupo</span><div class="seg hs" id="f-grupo"></div></div>
    <div class="fbloco"><span class="flab">Período</span>
      <div class="seg hs" id="f-rapido"></div>
      <div class="fduplo"><label>De<select id="f-de"></select></label><label>Até<select id="f-ate"></select></label></div>
    </div>
    <div class="fbloco" data-so="desp rec"><span class="flab">Centro de custo</span><div class="busca" data-campo="cc"></div></div>
    <div class="fbloco" data-so="desp"><span class="flab">Conta</span><div class="busca" data-campo="conta"></div></div>
    <div class="fbloco" data-so="desp"><span class="flab">Departamento</span><div class="busca" data-campo="dep"></div></div>
  </div>
  <div class="sh-foot"><button type="button" class="prim" data-fecha>Ver resultado</button></div>
</section>
<section class="sheet" id="sh-det" role="dialog" aria-modal="true" aria-labelledby="sh-det-t" hidden>
  <div class="sh-head"><h2 id="sh-det-t">Detalhe</h2><button type="button" class="ibtn" data-fecha aria-label="Fechar">×</button></div>
  <div class="sh-body" id="sh-det-b"></div>
</section>

<script src="servidor.js"></script>
<script src="fonte.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
