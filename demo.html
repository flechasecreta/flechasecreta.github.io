<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Flecha Secreta · Demonstração</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Flecha Secreta: o amigo secreto da sua turma">
<meta name="theme-color" content="#21402f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flecha Secreta">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icone-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* topo verde (atrás do relógio) e base clara (atrás da barra do iPhone), combinando com o aplicativo */
  html { background: #fbfcf8; }
  body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#21402f 0 50%, #fbfcf8 50% 100%); }
  html, body { height: 100%; }
  @media (prefers-color-scheme: dark) { html { background: #17221b; } body { background: linear-gradient(#16291e 0 50%, #17221b 50% 100%); } }
  /* telas de entrada do app (todas verdes): base também verde, sem faixa clara */
  body.capa, html.capa { background: #21402f; }
  @media (prefers-color-scheme: dark) { body.capa, html.capa { background: #16291e; } }
  #app {
    position: fixed; border: 0; background: #eef1ea;
    top: env(safe-area-inset-top, 0px); bottom: 0;
    left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100% - env(safe-area-inset-top, 0px));
  }
  #medida { position: fixed; visibility: hidden; pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 0px); padding-top: env(safe-area-inset-top, 0px); }
  /* dica no Safari: abrir pelo ícone */
  #dica { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 5; background: #fbfcf8; color: #1d2620; border: 1.5px solid #c9973a; border-radius: 14px; padding: 12px 40px 12px 14px;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; box-shadow: 0 8px 28px rgba(0,0,0,.3); transition: opacity .3s; }
  #dica b { color: #21402f; }
  #dica button { position: absolute; top: 6px; right: 6px; border: 0; background: none; font-size: 20px; padding: 6px 10px; color: #55615a; cursor: pointer; }
  #abertura {
    position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px;
    background: #21402f; color: #f3ead2; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px; transition: opacity .35s;
  }
  #abertura img { width: 96px; height: 96px; border-radius: 22px; }
  #abertura h1 { margin: 0; font: 400 30px/1.1 Georgia, "Times New Roman", serif; color: #fff; }
  #abertura .lema { opacity: .8; font-size: 14px; }
  #abertura .ajuda { font-size: 13px; opacity: .85; max-width: 32ch; }
  #abertura a { color: #e2b65e; }
  .some { opacity: 0; pointer-events: none; }
  /* pedido de permissão das notificações (o iPhone exige um toque na própria página de entrada) */
  #push { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: 20px; background: rgba(10, 20, 14, .55);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .25s; }
  #push .caixa { background: #fbfcf8; color: #1d2620; border-radius: 20px; padding: 22px 20px 18px; max-width: 340px; width: 100%; display: grid; gap: 12px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
  #push img { width: 64px; height: 64px; border-radius: 15px; justify-self: center; }
  #push h2 { margin: 0; font: 400 22px/1.2 Georgia, "Times New Roman", serif; color: #21402f; }
  #push p { margin: 0; color: #4a564e; font-size: 14px; }
  #push button { border: 0; border-radius: 999px; padding: 13px 18px; font: 600 16px system-ui, -apple-system, sans-serif; cursor: pointer; }
  #push .sim { background: #21402f; color: #fff; }
  #push .nao { background: none; color: #55615a; font-weight: 500; font-size: 14px; padding: 6px; }
  @media (prefers-color-scheme: dark) { #push .caixa { background: #1f2b23; color: #e8ede6; } #push h2 { color: #cfe3d2; } #push p { color: #b5c2b8; } #push .sim { background: #c9973a; color: #1d2620; } #push .nao { color: #b5c2b8; } }
</style>
</head>
<body>
<div id="abertura">
  <img src="icone-512.png" alt="">
  <div><h1>Flecha Secreta</h1><div class="lema">o amigo secreto da sua turma</div></div>
  <div class="ajuda" id="ajuda">Carregando a demonstração…</div>
</div>
<iframe id="app" title="Flecha Secreta" allow="clipboard-write"></iframe>
<div id="medida"></div>
<script>
/* ===================================================================
 * Página de entrada do Flecha Secreta.
 * Abre o aplicativo (Google Apps Script) em tela cheia e guarda a
 * sessão de quem entrou, para não pedir a senha toda vez no iPhone.
 * =================================================================== */
var APP = 'demo-app.html'; var APP_REAL = 'https://script.google.com/macros/s/AKfycbzJHZpYgQO5Tcs9giku5K84TcUfQnSWhji07c8SQ9shcdlkrWD_bbzKgDFl1Yf-Zgg/exec';   // termina em /exec
var CHAVE = 'flecha-dados-demo';

function ler() { try { return JSON.parse(localStorage.getItem(CHAVE) || '{}'); } catch (e) { return {}; } }
function gravar(d) { try { localStorage.setItem(CHAVE, JSON.stringify(d)); } catch (e) {} }
var GRANDES = ['flecha-fotos', 'flecha-cache'];
function lerTudo() { var d = ler(); GRANDES.forEach(function (k) { try { var v = localStorage.getItem(CHAVE + ':' + k); if (v != null) d[k] = v; } catch (e) {} }); return d; }
function margens() { var m = document.getElementById('medida'), cs = getComputedStyle(m); return { topo: parseFloat(cs.paddingTop) || 0, base: parseFloat(cs.paddingBottom) || 0 }; }

/* Repassa ao aplicativo os links que chegam por e-mail (?acao=...&t=...) e limpa o endereço */
var busca = location.search;
if (busca) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
var frame = document.getElementById('app');
frame.src = APP + (busca || '');

/* Conversa segura com o aplicativo: só aceita mensagens vindas do Google Apps Script */
function doGoogle(origem) { if (origem === location.origin) return true; try { return /\.googleusercontent\.com$/.test(new URL(origem).hostname); } catch (e) { return false; } }
window.addEventListener('message', function (ev) {
  if (!doGoogle(ev.origin) || !ev.data || !ev.data.flecha) return;
  if (ev.data.flecha === 'pedir') {
    ev.source.postMessage({ flecha: 'dados', dados: lerTudo(), margens: margens() }, ev.origin);
    esconderAbertura();
  } else if (ev.data.flecha === 'base') {
    var capa = ev.data.modo === 'capa';
    document.body.classList.toggle('capa', capa); document.documentElement.classList.toggle('capa', capa);
  } else if (ev.data.flecha === 'teclado') {
    voltarDepois(450);
  } else if (/^push-/.test(ev.data.flecha)) {
    tratarPush(ev.data, ev.source, ev.origin);
  } else if (ev.data.flecha === 'salvar' && typeof ev.data.chave === 'string' && /^flecha-/.test(ev.data.chave)) {
    if (GRANDES.indexOf(ev.data.chave) >= 0) {
      try { if (ev.data.valor == null) localStorage.removeItem(CHAVE + ':' + ev.data.chave); else localStorage.setItem(CHAVE + ':' + ev.data.chave, String(ev.data.valor).slice(0, 3000000)); } catch (e) {}
      return;
    }
    var d = ler();
    if (ev.data.valor == null) delete d[ev.data.chave]; else d[ev.data.chave] = String(ev.data.valor).slice(0, 20000);
    gravar(d);
  }
});

/* iPhone: depois que o teclado FECHA, a página às vezes fica "deslocada" e o toque cai fora do botão.
   Recoloca no lugar só com o teclado fechado: enquanto ele está aberto, o iPhone precisa deslizar a tela
   para mostrar o campo que está sendo digitado. */
function tecladoAberto() { var v = window.visualViewport; return !!(v && v.height < window.innerHeight - 120); }
function voltarAoTopo() {
  if (tecladoAberto()) return;
  if (window.scrollY || window.pageYOffset || document.documentElement.scrollTop) window.scrollTo(0, 0);
}
var tTopo = null;
function voltarDepois(ms) { clearTimeout(tTopo); tTopo = setTimeout(voltarAoTopo, ms); }
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function () { if (!tecladoAberto()) voltarDepois(250); });
}

/* ===================================================================
 * Notificações do aplicativo (OneSignal). O aplicativo pede pelo Perfil;
 * a permissão é pedida aqui, na página de entrada, com um toque da pessoa.
 * =================================================================== */
var PUSH_REAL = false;                                        // a demonstração só simula
var ONESIGNAL_APP = '7acca0f6-c0d0-4211-96d9-cd627d7dd522';
var ONESIGNAL_SAFARI = 'web.onesignal.auto.5a33fe23-ccc7-4feb-afe0-cf26b0b7b29c';
var pushPronto = null;
function noIconeAgora() { return !!(window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)); }
function ehIos() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function pushSuportado() { return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window; }
function carregarPush() {
  if (pushPronto) return pushPronto;
  pushPronto = new Promise(function (ok, falhou) {
    if (!PUSH_REAL) return ok(null);
    if (!pushSuportado()) return falhou(new Error('sem suporte'));
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(function (OneSignal) {
      return OneSignal.init({ appId: ONESIGNAL_APP, safari_web_id: ONESIGNAL_SAFARI, autoResubscribe: true, notifyButton: { enable: false } })
        .then(function () { ok(OneSignal); }, falhou);
    });
    var sc = document.createElement('script'); sc.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; sc.defer = true;
    sc.onerror = function () { falhou(new Error('não carregou')); };
    document.head.appendChild(sc);
    setTimeout(function () { falhou(new Error('demorou')); }, 15000);
  });
  pushPronto.catch(function () {});
  return pushPronto;
}
var demoPush = { permissao: 'default', inscrito: false };
function estadoPush() {
  var base = { flecha: 'push-estado', ios: ehIos(), noIcone: noIconeAgora(), suportado: PUSH_REAL ? pushSuportado() : true };
  if (!PUSH_REAL) { base.permissao = demoPush.permissao; base.inscrito = demoPush.inscrito; base.demo = true; return Promise.resolve(base); }
  if (!base.suportado) { base.permissao = 'indisponivel'; base.inscrito = false; return Promise.resolve(base); }
  base.permissao = Notification.permission;
  return carregarPush().then(function (OS) {
    base.inscrito = !!(OS.User && OS.User.PushSubscription && OS.User.PushSubscription.optedIn) && Notification.permission === 'granted';
    return base;
  }, function () { base.inscrito = false; base.erro = true; return base; });
}
function perguntarPush(aoTocar) {
  return new Promise(function (resp) {
    var d = document.createElement('div'); d.id = 'push';
    d.innerHTML = '<div class="caixa"><img src="icone-256.png" alt=""><h2>Avisos do Flecha Secreta</h2>' +
      '<p>Toque em <b>Permitir</b> aqui e, em seguida, confirme na pergunta do celular. Os avisos nunca mostram o nome do seu amigo secreto.</p>' +
      '<button class="sim">Permitir notificações</button><button class="nao">Agora não</button></div>';
    document.body.appendChild(d);
    function fim(v) { d.style.opacity = '0'; setTimeout(function () { d.remove(); }, 250); resp(v); }
    // o pedido ao celular acontece dentro do próprio toque (exigência do iPhone)
    d.querySelector('.sim').onclick = function () { var p = null; try { if (aoTocar) p = aoTocar(); } catch (e) {} fim(p || true); };
    d.querySelector('.nao').onclick = function () { fim(false); };
  });
}
/* espera a inscrição ficar pronta no OneSignal (na primeira vez o iPhone pode levar alguns segundos) */
function esperarInscricao(ms) {
  var ate = Date.now() + ms;
  return new Promise(function (ok) {
    (function ver() {
      estadoPush().then(function (e) { if (e.inscrito || e.permissao !== 'granted' || Date.now() > ate) ok(); else setTimeout(ver, 700); });
    })();
  });
}
function tratarPush(m, fonte, origem) {
  function responder(extra) { estadoPush().then(function (e) { for (var k in extra) e[k] = extra[k]; try { fonte.postMessage(e, origem); } catch (x) {} }); }
  var id = typeof m.id === 'string' && /^[a-z0-9]{6,64}$/.test(m.id) ? m.id : '';
  if (m.flecha === 'push-estado') return responder({});
  if (m.flecha === 'push-id') {             // ao abrir: mantém o celular ligado à pessoa certa
    if (!id || !PUSH_REAL || !pushSuportado() || Notification.permission !== 'granted') return;
    return carregarPush().then(function (OS) { return OS.login(id); }).catch(function () {});
  }
  if (m.flecha === 'push-sair') {
    if (!PUSH_REAL) { demoPush.inscrito = false; return; }
    if (!pushSuportado()) return;
    return carregarPush().then(function (OS) { return OS.logout(); }).catch(function () {});
  }
  if (m.flecha === 'push-desativar') {
    if (!PUSH_REAL) { demoPush.inscrito = false; return responder({}); }
    return carregarPush().then(function (OS) { return OS.User.PushSubscription.optOut(); }).catch(function () {}).then(function () { responder({}); });
  }
  if (m.flecha === 'push-ativar' && id) {
    if (!PUSH_REAL) {
      return perguntarPush().then(function (sim) { if (sim) { demoPush.permissao = 'granted'; demoPush.inscrito = true; } responder({ resposta: sim ? 'sim' : 'nao' }); });
    }
    if (!pushSuportado()) return responder({});
    if (Notification.permission === 'denied') return responder({});
    var OSp = carregarPush();
    function inscrever(OS) {
      return Promise.resolve(OS.login(id)).then(function () {
        if (Notification.permission === 'granted') return OS.User.PushSubscription.optIn();
        return OS.Notifications.requestPermission().then(function () { if (Notification.permission === 'granted') return OS.User.PushSubscription.optIn(); });
      });
    }
    if (Notification.permission === 'granted') return OSp.then(inscrever).catch(function () {}).then(function () { return esperarInscricao(15000); }).then(function () { responder({}); });
    return perguntarPush(function () { return Notification.requestPermission(); }).then(function (pedido) {
      if (!pedido) return responder({ resposta: 'nao' });
      return Promise.resolve(pedido).then(function () { return OSp; }).then(inscrever).catch(function () {}).then(function () { return esperarInscricao(20000); }).then(function () { responder({}); });
    });
  }
}
if (PUSH_REAL && pushSuportado() && Notification.permission === 'granted') carregarPush();

/* No Safari (fora do ícone da tela de início), uma dica rápida */
(function () {
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var noIcone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  return; // a demonstração não mostra a dica do ícone
  try { var ate = +localStorage.getItem('flecha-dica-ate') || 0; if (Date.now() < ate) return; } catch (e) {}
  var d = document.createElement('div'); d.id = 'dica';
  d.innerHTML = '📲 <b>Você está no Safari.</b> Se já colocou o Flecha Secreta na tela de início, abra pelo <b>ícone</b>. Se ainda não, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.<button aria-label="Fechar">✕</button>';
  function fechar() { d.style.opacity = '0'; setTimeout(function () { d.remove(); }, 300); try { localStorage.setItem('flecha-dica-ate', String(Date.now() + 3 * 864e5)); } catch (e) {} }
  d.querySelector('button').onclick = fechar;
  setTimeout(function () { document.body.appendChild(d); setTimeout(fechar, 12000); }, 2500);
})();

var abertura = document.getElementById('abertura');
function esconderAbertura() { abertura.classList.add('some'); }
frame.addEventListener('load', function () { setTimeout(esconderAbertura, 1500); });
setTimeout(function () {
  document.getElementById('ajuda').innerHTML = 'Está demorando? Verifique a internet ou <a href="' + APP + '" target="_blank" rel="noopener">abra o aplicativo direto</a>.';
}, 12000);
</script>
</body>
</html>
