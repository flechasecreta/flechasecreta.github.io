<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  /* topo verde (atrás do relógio) e base clara (atrás da barra do iPhone), combinando com o aplicativo */
  html { background: #fbfcf8; }
  body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#21402f 0 50%, #fbfcf8 50% 100%); }
  html, body { height: 100%; }
  @media (prefers-color-scheme: dark) { html { background: #17221b; } body { background: linear-gradient(#16291e 0 50%, #17221b 50% 100%); } }
  /* telas de entrada do app (todas verdes): base também verde, sem faixa clara */
  body.capa, html.capa { background: #21402f; }
  @media (prefers-color-scheme: dark) { body.capa, html.capa { background: #16291e; } }
  #app {
    position: fixed; border: 0; background: #eef1ea;
    top: env(safe-area-inset-top, 0px); bottom: 0;
    left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100% - env(safe-area-inset-top, 0px));
  }
  #medida { position: fixed; visibility: hidden; pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 0px); padding-top: env(safe-area-inset-top, 0px); }
  /* dica no Safari: abrir pelo ícone */
  #dica { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 5; background: #fbfcf8; color: #1d2620; border: 1.5px solid #c9973a; border-radius: 14px; padding: 12px 40px 12px 14px;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; box-shadow: 0 8px 28px rgba(0,0,0,.3); transition: opacity .3s; }
  #dica b { color: #21402f; }
  #dica button { position: absolute; top: 6px; right: 6px; border: 0; background: none; font-size: 20px; padding: 6px 10px; color: #55615a; cursor: pointer; }
  #abertura {
    position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px;
    background: #21402f; color: #f3ead2; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px; transition: opacity .35s;
  }
  #abertura img { width: 96px; height: 96px; border-radius: 22px; }
  #abertura h1 { margin: 0; font: 400 30px/1.1 Georgia, "Times New Roman", serif; color: #fff; }
  #abertura .lema { opacity: .8; font-size: 14px; }
  #abertura .ajuda { font-size: 13px; opacity: .85; max-width: 32ch; }
  #abertura a { color: #e2b65e; }
  .some { opacity: 0; pointer-events: none; }
  /* faixa para abrir um link quando o celular bloqueia a abertura automática */
  #link { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 8; display: flex; gap: 10px; align-items: center;
    background: #21402f; color: #f3ead2; border-radius: 14px; padding: 12px 8px 12px 16px; box-shadow: 0 8px 28px rgba(0,0,0,.35);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #link a { color: #ffd98a; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 6px 0; }
  #link button { border: 0; background: none; color: #f3ead2; font-size: 22px; line-height: 1; padding: 6px 10px; cursor: pointer; }
  /* pedido de permissão das notificações (o iPhone exige um toque na própria página de entrada) */
  #push { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: 20px; background: rgba(10, 20, 14, .55);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .25s; }
  #push .caixa { background: #fbfcf8; color: #1d2620; border-radius: 20px; padding: 22px 20px 18px; max-width: 340px; width: 100%; display: grid; gap: 12px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
  #push img { width: 64px; height: 64px; border-radius: 15px; justify-self: center; }
  #push h2 { margin: 0; font: 400 22px/1.2 Georgia, "Times New Roman", serif; color: #21402f; }
  #push p { margin: 0; color: #4a564e; font-size: 14px; }
  #push button { border: 0; border-radius: 999px; padding: 13px 18px; font: 600 16px system-ui, -apple-system, sans-serif; cursor: pointer; }
  #push .sim { background: #21402f; color: #fff; }
  #push .nao { background: none; color: #55615a; font-weight: 500; font-size: 14px; padding: 6px; }
  @media (prefers-color-scheme: dark) { #push .caixa { background: #1f2b23; color: #e8ede6; } #push h2 { color: #cfe3d2; } #push p { color: #b5c2b8; } #push .sim { background: #c9973a; color: #1d2620; } #push .nao { color: #b5c2b8; } }
</style>

<body>
<div id="abertura">
  <img src="icone-512.png" alt="">
  <div><h1>Flecha Secreta</h1><div class="lema">o amigo secreto da sua turma</div></div>
  <div class="ajuda" id="ajuda">Carregando a demonstração…</div>
</div>
<iframe id="app" title="Flecha Secreta" allow="clipboard-write"></iframe>
<div id="medida"></div>
<script>
/* ===================================================================
 * Página de entrada do Flecha Secreta.
 * Abre o aplicativo (Google Apps Script) em tela cheia e guarda a
 * sessão de quem entrou, para não pedir a senha toda vez no iPhone.
 * =================================================================== */
var APP = 'demo-app.html'; var APP_REAL = 'https://script.google.com/macros/s/AKfycbzJHZpYgQO5Tcs9giku5K84TcUfQnSWhji07c8SQ9shcdlkrWD_bbzKgDFl1Yf-Zgg/exec';   // termina em /exec
var CHAVE = 'flecha-dados-demo';

function ler() { try { return JSON.parse(localStorage.getItem(CHAVE) || '{}'); } catch (e) { return {}; } }
function gravar(d) { try { localStorage.setItem(CHAVE, JSON.stringify(d)); } catch (e) {} }
var GRANDES = ['flecha-fotos', 'flecha-cache'];
function lerTudo() { var d = ler(); GRANDES.forEach(function (k) { try { var v = localStorage.getItem(CHAVE + ':' + k); if (v != null) d[k] = v; } catch (e) {} }); return d; }
function margens() { var m = document.getElementById('medida'), cs = getComputedStyle(m); return { topo: parseFloat(cs.paddingTop) || 0, base: parseFloat(cs.paddingBottom) || 0 }; }

/* Repassa ao aplicativo os links que chegam por e-mail (?acao=...&t=...) e limpa o endereço */
var busca = location.search;
if (busca) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
/* ?diag=1 liga (e ?diag=0 desliga) o modo de diagnóstico do teclado NESTE aparelho; o parâmetro não segue para o aplicativo */
(function () { try { var q = new URLSearchParams(busca); if (!q.has('diag')) return;
  if (q.get('diag') === '0') localStorage.removeItem('flecha-diag'); else localStorage.setItem('flecha-diag', '1');
  q.delete('diag'); var r = q.toString(); busca = r ? '?' + r : ''; } catch (e) {} })();
var DIAG = null;   // função de registro, só existe com o diagnóstico ligado
function dg(ev, extra) { if (DIAG) DIAG(ev, extra); }
var frame = document.getElementById('app');
frame.src = APP + (busca || '');

/* Conversa segura com o aplicativo: só aceita mensagens vindas do Google Apps Script */
function doGoogle(origem) { if (origem === location.origin) return true; try { return /\.googleusercontent\.com$/.test(new URL(origem).hostname); } catch (e) { return false; } }
window.addEventListener('message', function (ev) {
  if (!doGoogle(ev.origin) || !ev.data || !ev.data.flecha) return;
  if (ev.data.flecha === 'pedir') {
    appFonte = ev.source; appOrigem = ev.origin;
    ev.source.postMessage({ flecha: 'dados', dados: lerTudo(), margens: margens(), links: true }, ev.origin);
    esconderAbertura();
  } else if (ev.data.flecha === 'base') {
    var capa = ev.data.modo === 'capa';
    document.body.classList.toggle('capa', capa); document.documentElement.classList.toggle('capa', capa);
  } else if (ev.data.flecha === 'foco') {
    // o teclado está abrindo: informa ao app a faixa visível (em coordenadas do app), algumas vezes enquanto ele sobe
    var fonte = ev.source, origem = ev.origin; dg('FOCO');
    [120, 380, 700].forEach(function (ms) { setTimeout(function () { informarVisivel(fonte, origem); }, ms); });
  } else if (ev.data.flecha === 'teclado') {
    dg('SAIU-FOCO'); voltarDepois(450);
  } else if (ev.data.flecha === 'abrir-link') {
    abrirLink(ev.data.url);
  } else if (/^push-/.test(ev.data.flecha)) {
    tratarPush(ev.data, ev.source, ev.origin);
  } else if (ev.data.flecha === 'salvar' && typeof ev.data.chave === 'string' && /^flecha-/.test(ev.data.chave)) {
    if (GRANDES.indexOf(ev.data.chave) >= 0) {
      try { if (ev.data.valor == null) localStorage.removeItem(CHAVE + ':' + ev.data.chave); else localStorage.setItem(CHAVE + ':' + ev.data.chave, String(ev.data.valor).slice(0, 3000000)); } catch (e) {}
      return;
    }
    var d = ler();
    if (ev.data.valor == null) delete d[ev.data.chave]; else d[ev.data.chave] = String(ev.data.valor).slice(0, 20000);
    gravar(d);
  }
});

/* Links escritos nas mensagens: o app pede e ESTA página abre o endereço, em nova aba / no navegador, sem tirar o app do lugar.
   Só http e https. Se o celular bloquear a abertura automática, aparece uma faixa com o link para tocar. */
function enderecoSeguro(u) {
  if (typeof u !== 'string' || !u || u.length > 2000 || /[\s<>"'`\\]/.test(u)) return '';
  try { var o = new URL(u); return (o.protocol === 'http:' || o.protocol === 'https:') && o.hostname && !o.username && !o.password ? o.href : ''; } catch (e) { return ''; }
}
function fecharFaixaLink() { var f = document.getElementById('link'); if (f) f.remove(); }
function faixaLink(url) {
  fecharFaixaLink();
  var f = document.createElement('div'); f.id = 'link';
  var t = document.createElement('span'); t.textContent = 'Abrir no navegador:';
  var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  var dom = ''; try { dom = new URL(url).hostname.replace(/^www\./i, ''); } catch (e) {}
  a.textContent = dom || 'abrir link'; a.onclick = function () { setTimeout(fecharFaixaLink, 300); };
  var x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'Fechar'); x.textContent = '×'; x.onclick = fecharFaixaLink;
  f.appendChild(t); f.appendChild(a); f.appendChild(x); document.body.appendChild(f);
  setTimeout(function () { if (f.parentNode) f.remove(); }, 12000);
}
function abrirLink(u) {
  var url = enderecoSeguro(u); if (!url) return false;
  // link desta própria página com "diag": em vez de abrir, liga ou desliga o diagnóstico do teclado neste aparelho
  try { var o = new URL(url); if (o.origin === location.origin && o.searchParams.has('diag')) { diagLigar(o.searchParams.get('diag') !== '0'); return true; } } catch (e) {}
  var w = null; try { w = window.open(url, '_blank'); } catch (e) {}
  if (w) { try { w.opener = null; } catch (e) {} return true; }
  // não abriu sozinho (bloqueio de janelas): oferece o link num toque direto nesta página, que o celular sempre aceita
  faixaLink(url);
  // se o endereço abriu mesmo assim (o app saiu da frente), a faixa não é mais necessária
  var some = function () { if (document.hidden) fecharFaixaLink(); };
  document.addEventListener('visibilitychange', some); setTimeout(function () { document.removeEventListener('visibilitychange', some); }, 12000);
  return false;
}

/* iPhone: depois que o teclado FECHA, a página às vezes fica "deslocada" e o toque cai fora do botão.
   Recoloca no lugar só com o teclado fechado: enquanto ele está aberto, o iPhone precisa deslizar a tela
   para mostrar o campo que está sendo digitado. */
var appFonte = null, appOrigem = '';
/* sempre que o teclado abre ou fecha, o app fica sabendo qual parte dele está visível */
function aoMudarVisivel() { ajustarAoTeclado(); if (appFonte) informarVisivel(appFonte, appOrigem); }
if (window.visualViewport) { window.visualViewport.addEventListener('resize', aoMudarVisivel); window.visualViewport.addEventListener('scroll', aoMudarVisivel); }
window.addEventListener('scroll', function () { if (encolhido) aoMudarVisivel(); });
function informarVisivel(fonte, origem) {
  ajustarAoTeclado();
  var v = window.visualViewport, r = frame.getBoundingClientRect();
  var topoV = v ? v.offsetTop : 0, altV = v ? v.height : window.innerHeight;
  // "teclado: true" = o app está encolhido na área visível (ele esconde a barra de abas e cola o campo no fim)
  try { fonte.postMessage({ flecha: 'visivel', de: topoV - r.top, ate: topoV + altV - r.top, teclado: encolhido, alt: encolhido ? parseInt(frame.style.height, 10) || 0 : 0 }, origem); } catch (e) {}
  dg('visivel', Math.round(topoV - r.top) + '..' + Math.round(topoV + altV - r.top) + (encolhido ? ' enc' : ''));
}
/* Com o teclado aberto, o app passa a ocupar SÓ a área visível acima do teclado, e a página fica parada no alto.
   Assim o cabeçalho continua no lugar e o campo fica logo acima do teclado, sem o iPhone empurrar a página inteira
   (que fazia o cabeçalho sumir e deixava um vão vazio). Se o iPhone insistir em deslizar a página, desiste nesta
   abertura do teclado e volta ao jeito antigo (app em altura cheia, o iPhone desliza a tela). */
var encolhido = false, puxadas = 0, desistiu = false;
function ajustarAoTeclado() {
  var v = window.visualViewport; if (!v) return;
  if (!tecladoAberto()) {
    if (encolhido) { encolhido = false; frame.style.height = ''; frame.style.bottom = ''; dg('SOLTA'); }
    puxadas = 0; desistiu = false; return;
  }
  if (desistiu) return;
  var alt = Math.max(160, Math.round(v.height - margens().topo)) + 'px';
  if (frame.style.height !== alt) { frame.style.height = alt; frame.style.bottom = 'auto'; dg('ENCOLHE', alt); }
  encolhido = true;
  if (window.scrollY || window.pageYOffset || document.documentElement.scrollTop) {
    if (++puxadas > 8) { desistiu = true; encolhido = false; frame.style.height = ''; frame.style.bottom = ''; dg('DESISTE'); return; }
    dg('sobe', puxadas); window.scrollTo(0, 0);
  }
}
/* No iPhone (app instalado), o próprio window.innerHeight encolhe junto com o teclado, às vezes antes do aviso de
   mudança de tamanho. Comparar com ele fazia o portal achar que o teclado estava fechado e puxar a tela de volta
   para o alto, escondendo o campo atrás do teclado (visto no diagnóstico de 25/11/2026). Por isso a comparação é
   com a maior altura já vista nesta posição do aparelho. */
var altCheia = 0;
function alturaCheia() { var v = window.visualViewport; altCheia = Math.max(altCheia, window.innerHeight || 0, v ? v.height : 0); return altCheia; }
alturaCheia();
window.addEventListener('orientationchange', function () { altCheia = 0; });
function tecladoAberto() { var v = window.visualViewport; return !!(v && v.height < alturaCheia() - 120); }
function voltarAoTopo() {
  if (tecladoAberto()) { dg('topo-nao'); return; }
  if (window.scrollY || window.pageYOffset || document.documentElement.scrollTop) { dg('TOPO!'); window.scrollTo(0, 0); } else dg('topo-ok');
}

/* ---------- Diagnóstico do teclado (só no aparelho em que foi ligado) ----------
   Mostra, num quadro por cima do aplicativo, o que o celular informa enquanto o teclado abre e fecha: altura visível (h),
   deslocamento da tela (o), rolagem da página (sY) e os avisos trocados com o aplicativo. Não registra texto digitado nem dado
   de ninguém, e nada sai do aparelho. Liga com um link desta página com "?diag=1"; desliga com "?diag=0" ou no × do quadro. */
function diagLigar(sim) {
  try { if (sim) localStorage.setItem('flecha-diag', '1'); else localStorage.removeItem('flecha-diag'); } catch (e) {}
  var q = document.getElementById('diag');
  if (!sim) { DIAG = null; if (q) q.remove(); return; }
  if (q) return;
  q = document.createElement('div'); q.id = 'diag';
  q.style.cssText = 'position:fixed;left:4px;top:calc(env(safe-area-inset-top,0px) + 2px);z-index:50;background:rgba(0,0,0,.8);color:#8dffa8;' +
    'font:10.5px/1.25 ui-monospace,Menlo,Consolas,monospace;padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre;max-width:calc(100% - 8px);overflow:hidden';
  var x = document.createElement('button'); x.type = 'button'; x.textContent = '× desligar diagnóstico';
  x.style.cssText = 'pointer-events:auto;display:block;border:0;border-radius:4px;background:#8dffa8;color:#000;font:inherit;padding:3px 8px;margin-bottom:3px';
  x.onclick = function () { diagLigar(false); };
  var estado = document.createElement('div'), lista = document.createElement('div'); estado.style.color = '#fff';
  q.appendChild(x); q.appendChild(estado); q.appendChild(lista); document.body.appendChild(q);
  var t0 = Date.now(), linhas = [], ult = '';
  function medir() { var v = window.visualViewport, r = frame.getBoundingClientRect();
    return { h: Math.round(v ? v.height : window.innerHeight), o: Math.round(v ? v.offsetTop : 0), sY: Math.round(window.scrollY || 0),
      iH: window.innerHeight, ft: Math.round(r.top), fh: Math.round(r.height) }; }
  function pintar(m) {
    estado.textContent = 'h=' + m.h + ' o=' + m.o + ' sY=' + m.sY + ' iH=' + m.iH + ' app=' + m.ft + '/' + m.fh + (tecladoAberto() ? ' TECLADO' : ' sem-tecl');
    lista.textContent = linhas.join('\n');
    q.style.transform = 'translateY(' + m.o + 'px)';   // acompanha a tela quando o iPhone a empurra para cima
  }
  DIAG = function (ev, extra) { var m = medir(), s = ((Date.now() - t0) / 1000 % 1000).toFixed(2);
    linhas.push((s.length < 6 ? ' ' + s : s) + ' ' + (ev + '         ').slice(0, 9) + ' h=' + m.h + ' o=' + m.o + ' sY=' + m.sY + (extra ? ' ' + extra : ''));
    if (linhas.length > 14) linhas.shift();
    ult = m.h + '|' + m.o + '|' + m.sY; pintar(m); };
  var v = window.visualViewport;
  if (v) { v.addEventListener('resize', function () { dg('vv-tam'); }); v.addEventListener('scroll', function () { dg('vv-rola'); }); }
  window.addEventListener('scroll', function () { dg('pag-rola'); });
  window.addEventListener('resize', function () { dg('jan-tam'); });
  window.addEventListener('blur', function () { dg('app-foco'); });      // o foco entrou no aplicativo (iframe)
  window.addEventListener('focus', function () { dg('pag-foco'); });     // o foco voltou para esta página
  document.addEventListener('visibilitychange', function () { dg(document.hidden ? 'oculta' : 'visivel?'); });
  setInterval(function () { var m = medir(), k = m.h + '|' + m.o + '|' + m.sY; if (k !== ult) dg('mudou'); else pintar(m); }, 150);
  dg('ligado');
}
try { if (localStorage.getItem('flecha-diag') === '1') diagLigar(true); } catch (e) {}
var tTopo = null;
function voltarDepois(ms) { clearTimeout(tTopo); tTopo = setTimeout(voltarAoTopo, ms); }
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function () { if (!tecladoAberto()) voltarDepois(250); });
}

/* ===================================================================
 * Notificações do aplicativo (OneSignal). O aplicativo pede pelo Perfil;
 * a permissão é pedida aqui, na página de entrada, com um toque da pessoa.
 * =================================================================== */
var PUSH_REAL = false;                                        // a demonstração só simula
var ONESIGNAL_APP = '7acca0f6-c0d0-4211-96d9-cd627d7dd522';
var ONESIGNAL_SAFARI = 'web.onesignal.auto.5a33fe23-ccc7-4feb-afe0-cf26b0b7b29c';
var pushPronto = null;
function noIconeAgora() { return !!(window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)); }
function ehIos() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function pushSuportado() { return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window; }
/* Carrega e inicia o OneSignal uma única vez. Uma demora NÃO fica "presa": a próxima chamada espera de novo
   pela mesma inicialização (que continua em andamento), em vez de desistir até o app ser fechado. */
var osInicio = null, osScript = false;
function iniciarOneSignal() {
  if (osInicio) return osInicio;
  osInicio = new Promise(function (ok, falhou) {
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(function (OneSignal) {
      return OneSignal.init({ appId: ONESIGNAL_APP, safari_web_id: ONESIGNAL_SAFARI, autoResubscribe: true, notifyButton: { enable: false } })
        .then(function () { ok(OneSignal); }, function (e) { if (/already initialized/i.test(String(e))) ok(OneSignal); else falhou(e); });
    });
    if (!osScript) {
      osScript = true;
      var sc = document.createElement('script'); sc.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; sc.defer = true;
      sc.onerror = function () { osScript = false; osInicio = null; sc.remove(); falhou(new Error('não carregou')); };
      document.head.appendChild(sc);
    }
  });
  osInicio.catch(function () {});
  return osInicio;
}
function carregarPush(ms) {
  if (!PUSH_REAL) return Promise.resolve(null);
  if (!pushSuportado()) return Promise.reject(new Error('sem suporte'));
  return Promise.race([iniciarOneSignal(), new Promise(function (_, falhou) { setTimeout(function () { falhou(new Error('demorou')); }, ms || 30000); })]);
}
/* inscrito = permissão concedida e inscrição ativa no OneSignal (optedIn, ou já com identificador e token) */
function inscritoAgora(OS) {
  var sb = OS && OS.User && OS.User.PushSubscription;
  return Notification.permission === 'granted' && !!(sb && (sb.optedIn || (sb.id && sb.token)));
}
var demoPush = { permissao: 'default', inscrito: false };
function estadoPush() {
  var base = { flecha: 'push-estado', ios: ehIos(), noIcone: noIconeAgora(), suportado: PUSH_REAL ? pushSuportado() : true };
  if (!PUSH_REAL) { base.permissao = demoPush.permissao; base.inscrito = demoPush.inscrito; base.demo = true; return Promise.resolve(base); }
  if (!base.suportado) { base.permissao = 'indisponivel'; base.inscrito = false; return Promise.resolve(base); }
  base.permissao = Notification.permission;
  return carregarPush().then(function (OS) {
    base.inscrito = inscritoAgora(OS);
    if (base.inscrito || base.permissao !== 'granted') return base;
    // logo depois de abrir, a inscrição pode ainda estar sendo lida: confere de novo por alguns segundos
    return new Promise(function (ok) {
      var n = 0; (function ver() { if (inscritoAgora(OS) || ++n > 8) { base.inscrito = inscritoAgora(OS); ok(base); } else setTimeout(ver, 500); })();
    });
  }, function () { base.inscrito = false; base.erro = true; return base; });
}
function perguntarPush(aoTocar) {
  return new Promise(function (resp) {
    var d = document.createElement('div'); d.id = 'push';
    d.innerHTML = '<div class="caixa"><img src="icone-256.png" alt=""><h2>Avisos do Flecha Secreta</h2>' +
      '<p>Toque em <b>Permitir</b> aqui e, em seguida, confirme na pergunta do celular. Os avisos nunca mostram o nome do seu amigo secreto.</p>' +
      '<button class="sim">Permitir notificações</button><button class="nao">Agora não</button></div>';
    document.body.appendChild(d);
    function fim(v) { d.style.opacity = '0'; setTimeout(function () { d.remove(); }, 250); resp(v); }
    // o pedido ao celular acontece dentro do próprio toque (exigência do iPhone)
    d.querySelector('.sim').onclick = function () { var p = null; try { if (aoTocar) p = aoTocar(); } catch (e) {} fim(p || true); };
    d.querySelector('.nao').onclick = function () { fim(false); };
  });
}
/* espera a inscrição ficar pronta no OneSignal (na primeira vez o celular pode levar alguns segundos) */
function esperarInscricao(OS, ms) {
  var ate = Date.now() + ms;
  return new Promise(function (ok) {
    (function ver() { if (inscritoAgora(OS) || Notification.permission !== 'granted' || Date.now() > ate) ok(); else setTimeout(ver, 400); })();
  });
}
/* roda um passo do OneSignal sem deixar a ativação presa: se demorar ou der erro, segue adiante */
function semPrender(passo, ms) {
  var p; try { p = Promise.resolve(passo()); } catch (e) { p = Promise.resolve(); }
  return Promise.race([p, new Promise(function (ok) { setTimeout(ok, ms); })]).catch(function () {});
}
/* Inscreve o aparelho NA HORA. No OneSignal, optIn() só marca a opção "quero receber"; quem registra o aparelho de fato
   é Notifications.requestPermission() (com a permissão já dada ele não pergunta nada, só registra). Antes, sem esse passo,
   a inscrição só acontecia na próxima vez que o app era aberto, e a ativação parecia travada. */
function inscreverAparelho(OS, id) {
  return semPrender(function () { return OS.login(id); }, 6000)
    .then(function () { return semPrender(function () { return OS.Notifications.requestPermission(); }, 25000); })
    .then(function () { return semPrender(function () { return OS.User.PushSubscription.optIn(); }, 6000); })
    .then(function () { return esperarInscricao(OS, 12000); });
}
function tratarPush(m, fonte, origem) {
  function responder(extra) { estadoPush().then(function (e) { for (var k in extra) e[k] = extra[k]; try { fonte.postMessage(e, origem); } catch (x) {} }); }
  var id = typeof m.id === 'string' && /^[a-z0-9]{6,64}$/.test(m.id) ? m.id : '';
  if (m.flecha === 'push-estado') return responder({});
  if (m.flecha === 'push-id') {             // ao abrir: mantém o celular ligado à pessoa certa
    if (!id || !PUSH_REAL || !pushSuportado() || Notification.permission !== 'granted') return;
    return carregarPush().then(function (OS) { return OS.login(id); }).catch(function () {});
  }
  if (m.flecha === 'push-sair') {
    if (!PUSH_REAL) { demoPush.inscrito = false; return; }
    if (!pushSuportado()) return;
    return carregarPush().then(function (OS) { return OS.logout(); }).catch(function () {});
  }
  if (m.flecha === 'push-desativar') {
    if (!PUSH_REAL) { demoPush.inscrito = false; return responder({}); }
    return carregarPush().then(function (OS) { return OS.User.PushSubscription.optOut(); }).catch(function () {}).then(function () { responder({}); });
  }
  if (m.flecha === 'push-ativar' && id) {
    if (!PUSH_REAL) {
      return perguntarPush().then(function (sim) { if (sim) { demoPush.permissao = 'granted'; demoPush.inscrito = true; } responder({ resposta: sim ? 'sim' : 'nao' }); });
    }
    if (!pushSuportado()) return responder({});
    if (Notification.permission === 'denied') return responder({});
    var OSp = carregarPush();   // começa a carregar já, enquanto a pessoa lê a pergunta
    OSp.catch(function () {});
    function inscrever(OS) { return Notification.permission === 'granted' ? inscreverAparelho(OS, id) : null; }
    if (Notification.permission === 'granted') return OSp.then(inscrever).catch(function () {}).then(function () { responder({}); });
    return perguntarPush(function () { return Notification.requestPermission(); }).then(function (pedido) {
      if (!pedido) return responder({ resposta: 'nao' });
      return Promise.resolve(pedido).catch(function () {}).then(function () { return OSp; }).then(inscrever).catch(function () {}).then(function () { responder({}); });
    });
  }
}
if (PUSH_REAL && pushSuportado() && Notification.permission === 'granted') carregarPush().catch(function () {});

/* No Safari (fora do ícone da tela de início), uma dica rápida */
(function () {
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var noIcone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  return; // a demonstração não mostra a dica do ícone
  try { var ate = +localStorage.getItem('flecha-dica-ate') || 0; if (Date.now() < ate) return; } catch (e) {}
  var d = document.createElement('div'); d.id = 'dica';
  d.innerHTML = '📲 <b>Você está no Safari.</b> Se já colocou o Flecha Secreta na tela de início, abra pelo <b>ícone</b>. Se ainda não, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.<button aria-label="Fechar">✕</button>';
  function fechar() { d.style.opacity = '0'; setTimeout(function () { d.remove(); }, 300); try { localStorage.setItem('flecha-dica-ate', String(Date.now() + 3 * 864e5)); } catch (e) {} }
  d.querySelector('button').onclick = fechar;
  setTimeout(function () { document.body.appendChild(d); setTimeout(fechar, 12000); }, 2500);
})();
